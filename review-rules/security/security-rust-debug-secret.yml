rules:
- id: security-rust-debug-secret
  languages:
  - rust
  message: 'RUST-06a/SEC-AUTH-03B: derive(Debug) may reveal secret material; use redacting wrappers/manual
    Debug and a leak test.'
  severity: ERROR
  metadata:
    examples:
    - nntunev2#3 session-keys-debug-secret
    - nntunev2#3 credential-structs-derive-debug
    confidence: LOW
    mode: shadow
    category: correctness
    proof: Advisory static signal; confirm with the named behavioral test before promotion.
  pattern-regex: (?s)#\[derive\([^)]*\bDebug\b[^)]*\)\]\s*(?:pub\s+)?struct\s+(?:[A-Za-z_]*(?i:secret|key|credential|vault|session|token)[A-Za-z_]*\s*\{[^}]*?\b\w+|\w+\s*\{[^}]*?\b(?:\w*_)?(?i:secret|password|passwd|api_?key|dek|token|kek|hmac|credential)s?)\s*:\s*(?:Option\s*<\s*)?(?:String|&\s*(?:\x27\w+\s+)?str|Vec\s*<\s*u8\s*>|\[u8\s*;\s*\d+\]|Bytes)(?=\s*[,}>])
