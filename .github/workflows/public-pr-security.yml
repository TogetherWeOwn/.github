# Generated by security-gate/render_workflow.py; edit that template and gate.py.
# The driver is embedded in this immutable workflow, NOT imported from the PR.
name: Public PR security

on:
  workflow_call:
    inputs:
      go-targets-json:
        description: '1-8 build targets: [{"goos":"linux","goarch":"amd64","tags":[]}] (CGO disabled)'
        type: string
        default: '[{"goos":"linux","goarch":"amd64","tags":[]}]'

permissions: {}

jobs:
  changes:
    name: Detect merge-base changes
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      full_run: ${{ steps.changes.outputs.full_run }}
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - name: Checkout full history for trusted change detection
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Detect paths against the merge base (errors fail closed)
        id: changes
        env:
          GATE_MODE: changes
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: &gate-driver |
          python3 -I - "$GATE_MODE" --repo "$GITHUB_WORKSPACE/target" --work "$RUNNER_TEMP/gate-work" --evidence "$RUNNER_TEMP/gate-evidence" --tools "$RUNNER_TEMP/gate-tools" <<'PY'
          #!/usr/bin/env python3
          """Trusted, bounded inspection and scanner driver. PR files are data, never imports."""

          import argparse
          import hashlib
          import io
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import selectors
          import signal
          import subprocess
          import tarfile
          import time
          import urllib.request

          MAX_FILES = 20000
          MAX_BYTES = 256 * 1024 * 1024
          MAX_FILE_BYTES = 16 * 1024 * 1024
          MAX_MODULES = 32
          SCAN_SECONDS = 300
          TOOLS = {
              "pinact": {
                  "version": "5.0.2",
                  "url": "https://github.com/suzuki-shunsuke/pinact/releases/download/v5.0.2/pinact_linux_amd64.tar.gz",
                  "sha256": "7f003d8f51e984c2264d2009d430e3e0e87ae404a0e2dc2a9a277b0f731bf5b7",
                  "member": "pinact",
              },
              "zizmor": {
                  "version": "1.32.0",
                  "url": "https://github.com/zizmorcore/zizmor/releases/download/v1.32.0/zizmor-x86_64-unknown-linux-gnu.tar.gz",
                  "sha256": "bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b",
                  "member": "zizmor",
              },
              "cargo-deny": {
                  "version": "0.20.2",
                  "url": "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz",
                  "sha256": "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f",
                  "member": "cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny",
              },
          }
          DENY_CONFIG = '''# Central policy: PR-local ignores are not loaded.
          [advisories]
          db-urls = ["https://github.com/RustSec/advisory-db"]
          ignore = []
          yanked = "deny"
          '''


          class GateError(Exception):
              pass


          def require(condition, message):
              if not condition:
                  raise GateError(message)


          def write_json(path, value):
              path.write_text(json.dumps(value, indent=2) + "\n", encoding="utf-8")


          def safe_path(value):
              require(isinstance(value, str) and 0 < len(value) <= 512, "invalid path length")
              parts = value.split("/")
              require(not any(p in ("", ".", "..", ".git") for p in parts), "unsafe path")
              require(not any(ord(c) < 32 or ord(c) == 127 for c in value), "control character in path")
              require(not value.startswith("/") and "\\" not in value, "unsafe path")
              return PurePosixPath(value)


          def git(repo, *args):
              # A timeout and on-disk size check avoid unbounded captured stdout.
              import tempfile
              with tempfile.TemporaryFile() as output:
                  result = subprocess.run(["git", "-C", str(repo), *args], stdout=output,
                                          stderr=subprocess.PIPE, timeout=30, check=False)
                  require(result.returncode == 0, "git inspection failed")
                  require(output.tell() <= MAX_FILE_BYTES, "git output too large")
                  output.seek(0)
                  return output.read()


          def changes(repo, base, head):
              require(re.fullmatch(r"[0-9a-f]{40}|HEAD", base or "") and
                      re.fullmatch(r"[0-9a-f]{40}|HEAD", head or ""), "invalid change-detection revision")
              merge_base = git(repo, "merge-base", base, head).decode("ascii").strip()
              require(re.fullmatch(r"[0-9a-f]{40}", merge_base), "invalid merge base")
              raw = git(repo, "diff", "--name-only", "--no-renames", "-z", merge_base, head, "--")
              require(not raw or raw.endswith(b"\0"), "incomplete changed paths")
              paths = [p.decode("utf-8", errors="strict") for p in raw.split(b"\0")[:-1]]
              require(len(paths) <= MAX_FILES, "too many changed paths")
              for path in paths:
                  safe_path(path)
              # Only this narrow documentation area can skip. Everything else, including
              # unknown/deleted sources, dependencies, shared code and CI, forces all scans.
              def docs(path):
                  return path in ("README.md", "CHANGELOG.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md",
                                  "SECURITY.md", "SUPPORT.md", "LICENSE", "LICENSE.md") or (
                      path.startswith("docs/") and PurePosixPath(path).suffix in (".md", ".rst"))
              docs_only = bool(paths) and all(docs(path) for path in paths)
              return {"merge_base": merge_base, "paths": paths, "docs_only": docs_only, "full_run": not docs_only}


          def inventory(repo):
              entries = {}
              total = 0
              for record in git(repo, "ls-tree", "-rlz", "--full-tree", "HEAD").split(b"\0"):
                  if not record:
                      continue
                  meta, raw_path = record.split(b"\t", 1)
                  path = raw_path.decode("utf-8", errors="strict")
                  safe_path(path)
                  require(path not in ("old-results.json", "new-results.json", "results.sarif"),
                          "tracked path conflicts with reserved OSV scanner output")
                  mode, kind, oid, size = meta.split()
                  # No submodules or symlinks: scanners must see a complete regular-file tree.
                  require(mode in (b"100644", b"100755") and kind == b"blob",
                          f"symlink/submodule or unsupported tracked entry: {path}")
                  length = int(size)
                  total += length
                  require(length <= MAX_FILE_BYTES and total <= MAX_BYTES, "checkout data exceeds limit")
                  entries[path] = (oid.decode("ascii"), length)
                  require(len(entries) <= MAX_FILES, "too many tracked paths")
              return entries


          def blob(repo, entry):
              content = git(repo, "cat-file", "blob", entry[0])
              require(len(content) == entry[1], "incomplete git blob")
              return content


          def discover(entries):
              modules = sorted(p for p in entries if PurePosixPath(p).name == "go.mod")
              locks = sorted(p for p in entries if PurePosixPath(p).name == "Cargo.lock")
              workflows = sorted(p for p in entries if
                                 (p.startswith(".github/workflows/") and p.endswith((".yml", ".yaml")))
                                 or PurePosixPath(p).name in ("action.yml", "action.yaml"))
              require(len(modules) <= MAX_MODULES and len(locks) <= MAX_MODULES,
                      "too many language modules (maximum 32 per language)")
              require(len(workflows) <= 256, "too many workflow/action files")
              for lock in locks:
                  manifest = str(PurePosixPath(lock).with_name("Cargo.toml"))
                  require(manifest in entries, f"lockfile without tracked Cargo.toml: {lock}")
              return {"go": modules, "cargo": locks, "workflows": workflows}


          def validate_vendor(repo, entries):
              trees = set()
              for path in entries:
                  parts = PurePosixPath(path).parts
                  for i, part in enumerate(parts):
                      if part in ("vendor", "third_party"):
                          require(i < len(parts) - 1, f"vendored tree is not a directory: {path}")
                          trees.add("/".join(parts[:i + 1]))
              for tree in sorted(trees):
                  name = tree + "/VENDORED.json"
                  require(name in entries, f"missing {name}")
                  require(entries[name][1] <= 65536, f"metadata too large: {name}")
                  data = json.loads(blob(repo, entries[name]))
                  require(isinstance(data, dict) and set(data) == {"dependencies"}, f"invalid metadata: {name}")
                  dependencies = data["dependencies"]
                  require(isinstance(dependencies, list) and 0 < len(dependencies) <= 1000,
                          f"invalid dependency list: {name}")
                  for dep in dependencies:
                      require(isinstance(dep, dict) and set(dep) == {"purl", "version", "upstream_commit"},
                              f"invalid dependency shape: {name}")
                      purl, version, commit = dep["purl"], dep["version"], dep["upstream_commit"]
                      require(isinstance(purl, str) and len(purl) <= 2048 and
                              re.fullmatch(r"pkg:[a-z][a-z0-9.+-]*/[^\s?#]+(?:\?[^\s#]+)?(?:#[^\s]+)?", purl),
                              f"invalid purl: {name}")
                      require(isinstance(version, str) and 0 < len(version.strip()) <= 256 and
                              not any(ord(c) < 32 for c in version), f"invalid version: {name}")
                      require(isinstance(commit, str) and re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}", commit),
                              f"upstream_commit must be a full Git object ID: {name}")
              return sorted(trees)


          def targets(raw):
              require(len(raw) <= 32768, "Go target input too large")
              data = json.loads(raw)
              require(isinstance(data, list) and 0 < len(data) <= 8, "expected 1-8 Go targets")
              for target in data:
                  require(isinstance(target, dict) and set(target) == {"goos", "goarch", "tags"},
                          "Go targets require goos, goarch, tags")
                  for key in ("goos", "goarch"):
                      require(isinstance(target[key], str) and re.fullmatch(r"[a-z0-9]{1,24}", target[key]),
                              f"invalid {key}")
                  require(isinstance(target["tags"], list) and len(target["tags"]) <= 32, "invalid Go tags")
                  require(all(isinstance(tag, str) and re.fullmatch(r"[A-Za-z0-9_.]{1,64}", tag)
                              for tag in target["tags"]), "invalid Go tag")
              return data


          def snapshot(repo, entries, dest, selected=None):
              dest.mkdir(parents=True, exist_ok=False)
              started = time.monotonic()
              for path in (entries if selected is None else selected):
                  require(time.monotonic() - started < 120, "snapshot exceeded 120 seconds")
                  # Cargo config can name executables (credential providers/rustc wrappers).
                  # Force the runner's pinned toolchains; never execute a PR-selected toolchain.
                  parts = PurePosixPath(path).parts
                  if ".cargo" in parts or parts[-1] in ("rust-toolchain", "rust-toolchain.toml"):
                      continue
                  output = dest / path
                  output.parent.mkdir(parents=True, exist_ok=True)
                  output.write_bytes(blob(repo, entries[path]))
                  # Deliberately no executable permission from PR data.
              return dest


          def install_tools(names, destination):
              destination.mkdir(parents=True, exist_ok=True)
              for name in names:
                  require(name in TOOLS, "unknown scanner installation")
                  tool = TOOLS[name]
                  request = urllib.request.Request(tool["url"], headers={"User-Agent": "public-pr-security-gate"})
                  with urllib.request.urlopen(request, timeout=60) as response:
                      archive = response.read(64 * 1024 * 1024 + 1)
                  require(len(archive) <= 64 * 1024 * 1024, "tool download too large")
                  require(hashlib.sha256(archive).hexdigest() == tool["sha256"], f"checksum mismatch: {name}")
                  # Never extract an archive, nor trust its symlinks, permissions or paths.
                  with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as tar:
                      members = tar.getmembers()
                      matches = [m for m in members if m.name == tool["member"] and m.isfile()]
                      require(len(matches) == 1 and matches[0].size <= 128 * 1024 * 1024,
                              f"invalid tool archive: {name}")
                      binary = tar.extractfile(matches[0]).read()
                  output = destination / name
                  output.write_bytes(binary)
                  output.chmod(0o755)


          def run_scan(command, cwd, evidence, name, env=None):
              started = time.monotonic()
              result = {"command": command, "complete": False}
              stdout = evidence / (name + ".json")
              stderr = evidence / (name + ".stderr")
              # The trusted parent bounds only the two evidence streams. A child file-size
              # rlimit would also break legitimate Go/Cargo cache and advisory DB writes.
              with stdout.open("wb") as out, stderr.open("wb") as err, selectors.DefaultSelector() as selector:
                  process = subprocess.Popen(command, cwd=cwd, env=env, stdout=subprocess.PIPE,
                                             stderr=subprocess.PIPE, start_new_session=True)
                  selector.register(process.stdout, selectors.EVENT_READ, out)
                  selector.register(process.stderr, selectors.EVENT_READ, err)
                  try:
                      while selector.get_map():
                          remaining = SCAN_SECONDS - (time.monotonic() - started)
                          require(remaining > 0, f"scanner timeout after {SCAN_SECONDS} seconds")
                          for key, _ in selector.select(timeout=min(remaining, 0.2)):
                              chunk = os.read(key.fileobj.fileno(), 65536)
                              if not chunk:
                                  selector.unregister(key.fileobj)
                                  continue
                              output = key.data
                              available = MAX_FILE_BYTES - output.tell()
                              output.write(chunk[:available])
                              require(len(chunk) <= available, "scanner output exceeded limit")
                      process.wait(timeout=max(0, SCAN_SECONDS - (time.monotonic() - started)))
                      result.update(returncode=process.returncode, complete=True)
                  except (GateError, OSError, subprocess.TimeoutExpired) as error:
                      result["error"] = (f"scanner timeout after {SCAN_SECONDS} seconds"
                                         if isinstance(error, subprocess.TimeoutExpired) else str(error))
                  finally:
                      if not result["complete"]:
                          try:
                              os.killpg(process.pid, signal.SIGKILL)
                          except ProcessLookupError:
                              pass
                          process.wait()
                      process.stdout.close()
                      process.stderr.close()
              result["seconds"] = round(time.monotonic() - started, 2)
              write_json(evidence / (name + ".status.json"), result)
              require(result["complete"], f"incomplete {name}: {result.get('error')}")
              require(0 < stdout.stat().st_size <= MAX_FILE_BYTES and stderr.stat().st_size <= MAX_FILE_BYTES,
                      f"missing or oversized scanner output: {name}")
              return process.returncode, json.loads(stdout.read_text())


          def sarif_clean(data):
              require(isinstance(data, dict) and data.get("version") == "2.1.0", "invalid SARIF version")
              runs = data.get("runs")
              require(isinstance(runs, list) and runs, "missing SARIF runs")
              for run in runs:
                  require(isinstance(run, dict) and isinstance(run.get("tool"), dict), "missing SARIF tool")
                  driver = run["tool"].get("driver")
                  require(isinstance(driver, dict) and isinstance(driver.get("name"), str) and driver["name"],
                          "missing SARIF tool driver")
                  for invocation in run.get("invocations", []):
                      require(isinstance(invocation, dict) and invocation.get("executionSuccessful") is not False,
                              "unsuccessful SARIF invocation")
                  results = run.get("results")
                  require(isinstance(results, list), "missing SARIF results")
                  require(not results, "scanner reported findings")


          def osv_evidence(work):
              documents = {}
              for name, relative in (("old", "osv-old/old-results.json"),
                                     ("new", "osv-new/new-results.json"),
                                     ("sarif", "osv-sarif/results.sarif")):
                  path = work / relative
                  require(path.is_file() and not path.is_symlink() and 0 < path.stat().st_size <= MAX_FILE_BYTES,
                          f"missing or oversized OSV {name} evidence")
                  documents[name] = json.loads(path.read_text())
              for name in ("old", "new"):
                  data = documents[name]
                  require(isinstance(data, dict) and isinstance(data.get("results"), list),
                          f"incomplete OSV {name} results")
                  for result in data["results"]:
                      require(isinstance(result, dict) and isinstance(result.get("source"), dict) and
                              isinstance(result.get("packages"), list), f"incomplete OSV {name} source")
                      for package in result["packages"]:
                          require(isinstance(package, dict) and isinstance(package.get("package"), dict) and
                                  package["package"].get("name"), f"incomplete OSV {name} package")
              sarif_clean(documents["sarif"])
              return {"scanner": "osv-evidence", "status": "passed"}


          def vex_clean(data):
              require(isinstance(data, dict) and data.get("@context") == "https://openvex.dev/ns/v0.2.0" and
                      re.fullmatch(r"govulncheck/vex:[0-9a-f]{64}", str(data.get("@id", ""))) and
                      data.get("author") and data.get("timestamp") and data.get("version") == 1 and
                      data.get("tooling") == "https://pkg.go.dev/golang.org/x/vuln/cmd/govulncheck",
                      "incomplete govulncheck OpenVEX")
              statements = data.get("statements")
              # v1.9.0 omits its nil statements slice entirely when the scan is clean.
              require(statements is None or isinstance(statements, list), "invalid OpenVEX statements")
              for statement in statements or []:
                  require(isinstance(statement, dict) and statement.get("vulnerability", {}).get("name") and
                          statement.get("products") and statement.get("status") in ("affected", "not_affected"),
                          "incomplete OpenVEX statement")
                  require(statement["status"] != "affected", "govulncheck found a reachable vulnerability")


          def workflow_scans(repo, entries, found, work, evidence, tools):
              files = found["workflows"]
              if not files:
                  return [{"scanner": "workflow-policy", "status": "not-applicable", "files": []}]
              require(os.environ.get("GITHUB_TOKEN"), "online policy requires GITHUB_TOKEN")
              tree = snapshot(repo, entries, work / "workflow-data", files)
              config = work / "pinact.yaml"
              config.write_text("version: 3\n")
              paths = [str(tree / path) for path in files]
              results = []
              commands = [
                  ("zizmor", [str(tools / "zizmor"), "--no-config", "--no-ignores",
                              "--strict-collection", "--persona=auditor", "--format=json-v1", *paths]),
                  ("pinact", [str(tools / "pinact"), "--config", str(config), "run", "--check",
                              "--verify-comment", "--format=sarif", *paths]),
              ]
              env = {key: value for key, value in os.environ.items()
                     if not key.startswith(("ZIZMOR_", "PINACT_"))}
              env.pop("GH_TOKEN", None)
              home = work / "policy-home"
              home.mkdir()
              env.update(HOME=str(home), XDG_CONFIG_HOME=str(home), GH_HOST="github.com")
              for name, command in commands:
                  try:
                      rc, data = run_scan(command, work, evidence, name, env)
                      require(rc == 0, f"{name} failed ({rc})")
                      if name == "zizmor":
                          require(isinstance(data, list) and not data, "zizmor reported findings or invalid output")
                      else:
                          sarif_clean(data)
                      results.append({"scanner": name, "status": "passed", "files": files})
                  except (GateError, ValueError, OSError) as error:
                      results.append({"scanner": name, "status": "failed", "error": str(error)})
              return results


          def dependency_scans(repo, entries, found, work, evidence, tools, go_targets):
              results = []
              if not found["go"] and not found["cargo"]:
                  return [{"scanner": "dependencies", "status": "not-applicable", "go": [], "cargo": []}]
              tree = snapshot(repo, entries, work / "source-data")
              env = os.environ.copy()
              # No workflow token in subprocesses; no PR configuration or automatic toolchain selection.
              for key in list(env):
                  if "TOKEN" in key or "SECRET" in key or key.startswith(("GIT_CONFIG", "CARGO_", "RUST", "GO")):
                      env.pop(key)
              env.update(GOTOOLCHAIN="local", GOENV="off", GOWORK="off", GOFLAGS="", CGO_ENABLED="0",
                         GOSUMDB="sum.golang.org", GOPROXY="https://proxy.golang.org", GOTELEMETRY="off",
                         RUSTUP_TOOLCHAIN="1.93.0", CARGO_HOME=str(work / "cargo-home"))
              for index, module in enumerate(found["go"]):
                  for target_index, target in enumerate(go_targets):
                      name = f"govulncheck-{index}-{target_index}"
                      command = [str(tools / "govulncheck"), "-scan=symbol", "-format=openvex",
                                 "-tags=" + ",".join(target["tags"]), "./..."]
                      try:
                          rc, data = run_scan(command, tree / PurePosixPath(module).parent, evidence, name,
                                              dict(env, GOOS=target["goos"], GOARCH=target["goarch"]))
                          require(rc == 0, f"govulncheck failed ({rc})")
                          vex_clean(data)
                          results.append({"scanner": name, "module": module, "target": target, "status": "passed"})
                      except (GateError, ValueError, OSError) as error:
                          results.append({"scanner": name, "module": module, "target": target,
                                          "status": "failed", "error": str(error)})
              config = work / "deny.toml"
              config.write_text(DENY_CONFIG)
              for index, lock in enumerate(found["cargo"]):
                  name = f"cargo-deny-{index}"
                  manifest = tree / PurePosixPath(lock).with_name("Cargo.toml")
                  command = [str(tools / "cargo-deny"), "--manifest-path", str(manifest), "--workspace",
                             "--locked", "--all-features", "--format=sarif", "--config", str(config),
                             "check", "advisories"]
                  try:
                      rc, data = run_scan(command, work, evidence, name, env)
                      require(rc == 0, f"cargo-deny failed ({rc})")
                      sarif_clean(data)
                      results.append({"scanner": name, "lockfile": lock, "status": "passed"})
                  except (GateError, ValueError, OSError) as error:
                      results.append({"scanner": name, "lockfile": lock, "status": "failed", "error": str(error)})
              return results


          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("mode", choices=("changes", "inspect", "policy", "dependencies", "install", "osv-evidence"))
              parser.add_argument("--repo", type=Path)
              parser.add_argument("--work", required=True, type=Path)
              parser.add_argument("--evidence", required=True, type=Path)
              parser.add_argument("--tools", required=True, type=Path)
              parser.add_argument("--tool-name", action="append", default=[])
              args = parser.parse_args()
              evidence = args.evidence.resolve()
              evidence.mkdir(parents=True, exist_ok=True)
              work = args.work.resolve()
              work.mkdir(parents=True, exist_ok=True)
              tools = args.tools.resolve()
              results = []
              try:
                  if args.mode == "install":
                      names = args.tool_name or json.loads(os.environ.get("INSTALL_TOOLS", "[]"))
                      require(isinstance(names, list) and names and all(isinstance(n, str) for n in names),
                              "invalid tool installation list")
                      install_tools(names, tools)
                      results.append({"scanner": "install", "status": "passed"})
                  elif args.mode == "changes":
                      changed = changes(args.repo, os.environ["BASE_SHA"], os.environ["HEAD_SHA"])
                      write_json(evidence / "changed-paths.json", changed)
                      if os.environ.get("GITHUB_OUTPUT"):
                          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                              for key in ("full_run", "docs_only"):
                                  output.write(f"{key}={str(changed[key]).lower()}\n")
                      results.append({"scanner": "changes", "status": "passed", **changed})
                  elif args.mode == "osv-evidence":
                      results.append(osv_evidence(work))
                  else:
                      entries = inventory(args.repo)
                      found = discover(entries)
                      write_json(evidence / "inventory.json", found)
                      if args.mode == "inspect" and os.environ.get("GITHUB_OUTPUT"):
                          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                              for key, paths in found.items():
                                  output.write(f"{key}={'true' if paths else 'false'}\n")
                      if args.mode == "inspect":
                          trees = validate_vendor(args.repo, entries)
                          results.append({"scanner": "vendored-metadata", "status": "passed", "trees": trees})
                      elif args.mode == "policy":
                          results.extend(workflow_scans(args.repo, entries, found, work, evidence, tools))
                      else:
                          results.extend(dependency_scans(args.repo, entries, found, work, evidence, tools,
                                                         targets(os.environ["GO_TARGETS"])))
              except (GateError, ValueError, OSError, subprocess.SubprocessError, KeyError) as error:
                  results.append({"scanner": args.mode, "status": "failed", "error": str(error)})
              write_json(evidence / (args.mode + ".json"), results)
              failed = any(result["status"] == "failed" for result in results)
              print(json.dumps(results))
              raise SystemExit(1 if failed else 0)


          if __name__ == "__main__":
              main()
          PY
      - name: Preserve change-detection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-changes
          path: ${{ runner.temp }}/gate-evidence/
          if-no-files-found: error
          retention-days: 5

  inspect:
    name: Inspect tracked PR data
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      go: ${{ steps.inspect.outputs.go }}
      cargo: ${{ steps.inspect.outputs.cargo }}
      workflows: ${{ steps.inspect.outputs.workflows }}
    steps:
      - name: Checkout PR merge tree as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: target
          persist-credentials: false
          submodules: false
      - name: Inspect tracked paths and vendored metadata
        id: inspect
        env:
          GATE_MODE: inspect
        run: *gate-driver
      - name: Preserve inspection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-inspection
          path: ${{ runner.temp }}/gate-evidence/
          if-no-files-found: error
          retention-days: 5

  osv:
    name: New OSV vulnerabilities
    needs: [changes, inspect]
    if: github.event_name == 'pull_request' && github.event.repository.private == false && needs.changes.outputs.full_run == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      fail-on-vuln: true
      upload-sarif: true
      checkout-submodules: false
      runs-on: ubuntu-24.04
      # One immutable empty policy for both comparison scans.
      scan-args: |
        --config=/dev/null
        -r
        ./

  osv-evidence:
    name: Validate OSV comparison evidence
    needs: [changes, osv]
    if: always() && github.event_name == 'pull_request' && github.event.repository.private == false && needs.changes.result == 'success' && needs.changes.outputs.full_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Download base scan from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: old-json-results
          path: ${{ runner.temp }}/gate-work/osv-old/
      - name: Download current scan from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: new-json-results
          path: ${{ runner.temp }}/gate-work/osv-new/
      - name: Download diff SARIF from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: OSV Scanner SARIF file
          path: ${{ runner.temp }}/gate-work/osv-sarif/
      - name: Validate both JSON scans and clean diff SARIF
        env:
          GATE_MODE: osv-evidence
        run: *gate-driver
      - name: Preserve OSV evidence validation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-osv-validation
          path: ${{ runner.temp }}/gate-evidence/
          if-no-files-found: error
          retention-days: 5

  workflow-policy:
    name: Online workflow and action policy
    needs: [changes, inspect]
    if: github.event_name == 'pull_request' && github.event.repository.private == false && needs.changes.outputs.full_run == 'true' && needs.inspect.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout PR merge tree as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: target
          persist-credentials: false
          submodules: false
      - name: Install checksum-pinned workflow scanners
        env:
          GATE_MODE: install
          INSTALL_TOOLS: '["zizmor","pinact"]'
        run: *gate-driver
      - name: Audit all tracked workflows and actions online
        env:
          GATE_MODE: policy
          GITHUB_TOKEN: ${{ github.token }}
        run: *gate-driver
      - name: Preserve workflow-policy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-workflow-policy
          path: ${{ runner.temp }}/gate-evidence/
          if-no-files-found: error
          retention-days: 5

  dependencies:
    name: Go symbols and Rust advisories
    needs: [changes, inspect]
    if: github.event_name == 'pull_request' && github.event.repository.private == false && needs.changes.outputs.full_run == 'true' && (needs.inspect.outputs.go == 'true' || needs.inspect.outputs.cargo == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout PR merge tree as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: target
          persist-credentials: false
          submodules: false
      - name: Install pinned Go toolchain
        if: needs.inspect.outputs.go == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install version-pinned govulncheck through the Go checksum database
        if: needs.inspect.outputs.go == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/gate-tools"
          timeout 300 go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
        env:
          GOBIN: ${{ runner.temp }}/gate-tools
          GOTOOLCHAIN: local
          GOENV: 'off'
          GOFLAGS: ''
          GOSUMDB: sum.golang.org
          GOPROXY: https://proxy.golang.org
          GONOSUMDB: ''
          GOPRIVATE: ''
          GONOPROXY: ''
          GOTELEMETRY: 'off'
      - name: Install pinned Rust toolchain (no PR rust-toolchain files)
        if: needs.inspect.outputs.cargo == 'true'
        run: timeout 300 rustup toolchain install 1.93.0 --profile minimal --no-self-update
      - name: Install checksum-pinned cargo-deny
        if: needs.inspect.outputs.cargo == 'true'
        env:
          GATE_MODE: install
          INSTALL_TOOLS: '["cargo-deny"]'
        run: *gate-driver
      - name: Scan every discovered module and workspace without a workflow token
        env:
          GATE_MODE: dependencies
          GO_TARGETS: ${{ inputs.go-targets-json }}
        run: *gate-driver
      - name: Preserve language-scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-language-scans
          path: ${{ runner.temp }}/gate-evidence/
          if-no-files-found: error
          retention-days: 5

  security-ok:
    name: security-ok
    needs: [changes, inspect, osv, osv-evidence, workflow-policy, dependencies]
    if: always() && github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require complete successful scans (only proven absence may skip)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          assert needs['changes']['result'] == 'success', 'change detection failed or incomplete'
          changed = needs['changes']['outputs']
          assert (changed.get('full_run'), changed.get('docs_only')) in (('true', 'false'), ('false', 'true')), 'change detection incomplete'
          full_run = changed['full_run'] == 'true'
          assert needs['inspect']['result'] == 'success', 'inspection failed or incomplete'
          found = needs['inspect']['outputs']
          assert all(found.get(k) in ('true', 'false') for k in ('go', 'cargo', 'workflows')), 'discovery incomplete'
          expected = {
              'osv': 'success' if full_run else 'skipped',
              'osv-evidence': 'success' if full_run else 'skipped',
              'workflow-policy': 'success' if full_run and found['workflows'] == 'true' else 'skipped',
              'dependencies': 'success' if full_run and 'true' in (found['go'], found['cargo']) else 'skipped',
          }
          for job, result in expected.items():
              assert needs[job]['result'] == result, f'{job}: expected {result}, got {needs[job]["result"]}'
          print('security-ok: complete evidence from every applicable scanner')
          PY
