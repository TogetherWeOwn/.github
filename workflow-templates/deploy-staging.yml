name: deploy-staging

# TogetherWeOwn pipeline standard §3: deploys every push to the default branch to staging. Nothing else lives in
# this file. Production promotes this workflow's last successful run (see deploy-production.yml), so it must never
# run production jobs or skipped-only dispatches.
# Replace the placeholder deploy step with the repo's real staging deploy.

on:
  push:
    branches: [ $default-branch ]

permissions:
  contents: read

# One staging deploy at a time; never cancel one in progress.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy to staging (replace)
        run: echo "deploy ${GITHUB_SHA} to staging"
