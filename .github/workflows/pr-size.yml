# Reusable advisory pull-request size labeller for the org CI standard.
#
# Lives in the org `.github` repo at `.github/workflows/pr-size.yml`.
# Callers reference a pinned SHA and pass only their generated paths:
#   uses: TogetherWeOwn/.github/.github/workflows/pr-size.yml@<sha>
#   with:
#     exclude-extra: "generated/**,snapshots/**"
# Starter caller: `workflow-templates/pr-size.yml`. Standard: the
# "Advisory PR-size labels" section of CI-STANDARD.md.
#
# ADVISORY ONLY. This workflow is never a required check and must never be
# added to a ruleset's required-workflows list (that would make it block
# merges). The labeller script exits 0 on any API failure.
#
# The labelling logic lives ONCE in `.github/scripts/pr_size.py` next to
# this file. The job checks out THIS repository at an explicit, reviewed
# main-branch commit, never a caller context or pull-request head: a pull
# request cannot run its own modified labeller, and cannot silence its own
# label by deleting the script. When the script changes, commit it first,
# then repin BOTH reusable workflows to that reviewed main-branch SHA.
# Thresholds are fixed centrally in the script (size/S <= 100, size/M <= 400,
# size/L <= 1000 counted lines, size/XL above that) and are not inputs.
#
# Why TWO reusable files: GitHub validates a reusable workflow's nested-job
# permissions against the caller job's grant statically, when parsing the
# workflow, and ignores the nested jobs' `if:` conditions (runner
# `PermissionsHelper.ValidateEmbeddedPermissions`). One file holding both
# the write-permission label job and the read-only weekly job would make a
# read-only weekly caller fail at startup - and an invalid workflow fails
# the whole run, label path included. So the weekly tally lives in its own
# file, `pr-size-weekly.yml`, and each caller grants only what the file it
# calls requests. `.github/scripts/test_pr_size_workflows.py` pins that
# caller-grant >= reusable-request contract for the shipped template.
#
# Token: no secrets are passed or needed. The job's GITHUB_TOKEN is minted
# for the caller's repository and capped by the caller's job permissions,
# so callers of THIS file grant `issues: write` + `pull-requests: write`
# (the weekly file's callers grant read-only). Never pass
# `secrets: inherit` to this workflow.
#
# Weekly tally: the schedule stays in the CALLER (a reusable workflow has
# no schedule of its own for caller repositories, and the tally is
# per-repository); the caller invokes `pr-size-weekly.yml` on its schedule.

name: pr-size (reusable)

on:
  workflow_call:
    inputs:
      pr-number:
        description: >-
          Pull request to label. Empty means the pull request that triggered
          the caller (`github.event.pull_request.number`).
        required: false
        default: ""
        type: string
      exclude-extra:
        description: >-
          Comma-separated extra exclusion globs for the caller's generated
          paths, on top of the script's built-in lockfile/generated/fixture
          list (e.g. "public/bundles/**,drizzle/meta/**").
        required: false
        default: ""
        type: string
      runs-on:
        description: >-
          JSON runner label(s), e.g. '["ubuntu-latest"]'.
        required: false
        default: '["ubuntu-latest"]'
        type: string

permissions:
  contents: read

jobs:
  label:
    name: label
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Fixed central source, independent of the caller's repository/ref.
      # This reviewed main commit carries the unchanged labeller from #23.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: TogetherWeOwn/.github
          ref: fcfe691790ac925e8c4cf5e191a5004d4d991392
          path: .pr-size-central
          sparse-checkout: .github/scripts/pr_size.py
          persist-credentials: false

      - name: Label the pull request (advisory)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number != '' && inputs.pr-number || github.event.pull_request.number }}
          # Fixed centrally: counted lines above this post the advisory
          # comment. Matches the size/M cap in pr_size.py (SIZES).
          PR_SIZE_THRESHOLD: "400"
          PR_SIZE_EXCLUDE_EXTRA: ${{ inputs.exclude-extra }}
        run: python3 .pr-size-central/.github/scripts/pr_size.py label
