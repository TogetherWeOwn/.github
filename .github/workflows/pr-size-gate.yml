# Reusable REQUIRED pull-request size gate for the org CI standard.
#
# Lives in the org `.github` repo at `.github/workflows/pr-size-gate.yml`.
# Callers reference a pinned SHA and pass only their generated paths:
#   uses: TogetherWeOwn/.github/.github/workflows/pr-size-gate.yml@<sha>
#   with:
#     exclude-extra: "generated/**,snapshots/**"
# Starter caller: `workflow-templates/pr-size.yml`. Standard: the
# "PR size gate" section of STANDARD.md (the split procedure lives there).
#
# REQUIRED CHECK. Unlike the advisory labeller (`pr-size.yml`), this gate
# FAILS when the reviewable diff exceeds the reviewability budget, so an
# over-limit pull request fails here instead of wasting a review cycle on
# a refusal (or a superficial review) later. The gate fails closed: if
# the size cannot be measured, the run errors instead of passing silently.
# Adopters add this check to their ruleset's required-workflows list once
# the caller workflow is on their default branch (STANDARD.md rule: never
# require a check before its workflow exists there).
#
# Thresholds: fixed at the org standard inside this workflow (there are
# no threshold inputs, so a caller cannot weaken the gate; do not raise
# them per repository). Counted = additions + deletions after the
# script's lockfile / generated / fixture exclusions.
#   - Target: 100-200 reviewable lines and 10 or fewer files.
#   - Warn: at or above 200 counted lines the gate posts a warning
#     comment and still passes.
#   - Gate (fixed below): FAIL over 400 counted lines or over 20 counted
#     files, unless the `size-exception` below applies.
#   - Hard stop (fixed below): at or above 1,000 counted lines the
#     exemption never applies; the pull request must be split (review
#     slices count as separate small pull requests).
#
# Why not Devin's ceiling? Devin's limit is not documented (product
# guide, Review API and 2026 release notes give no number). The org
# measurement of 739 recent PR heads brackets it instead:
#   - Reviewed: labelloop#12 (35,226 raw lines, 17 files),
#     two-web-next#2004 (18,119 lines, 231 files), nntunev2#957 (28,095),
#     paperclip-plugin-vuln-sentinel#1 (21,957), plus more at 10k-15k.
#   - Refused: nntunev2#908 (47,982 raw lines, 140 files), failed in 3
#     seconds (an instant refusal; genuine reviews take minutes). Draft
#     pull requests carry no Devin status at all (Devin does not run on
#     drafts), so they are not evidence either way.
# Setting the gate at that ceiling would merely accept everything up to
# the refusal point. The gate instead encodes the reviewability budget,
# far below any reviewer ceiling, grounded in:
#   - Google Small CLs (google.github.io/eng-practices): about 100 lines
#     is reasonable, about 1,000 too large.
#   - GitLab code review guidance (docs.gitlab.com): about 200 lines.
#   - SmartBear/Cisco peer-review findings: 200-400 lines per review
#     session.
# Re-measure before ever moving these numbers. Counted totals are
# always <= raw totals, and gate comments report raw and reviewable
# totals separately; hiding files in GitHub's display is not exclusion.
#
# A Devin status of `success` is not proof of review: merge-conflict
# skips also report success (two-web-next#2064). Whether Devin's report
# is a genuine review is decided by the review rules, which check the
# status description, not just its state - not by this gate.
#
# Exception: a pull request over the gate passes only with the
# `size-exception` label AND an APPROVED review from someone other than
# the author, and only below the 1,000-line hard stop. Even then, Devin
# must still be satisfied via review slices for the over-limit diff
# (STANDARD.md "PR size gate"). The script ensures the label exists so
# authors can apply it themselves.
#
# The gating logic lives ONCE in `.github/scripts/pr_size.py` next to this
# file. The job checks out THIS repository at an explicit, reviewed
# main-branch commit, never a caller context or pull-request head: a pull
# request cannot run its own modified gate. When the script changes, commit
# it first, then repin ALL THREE reusable workflows to that reviewed
# main-branch SHA.
#
# Why its own file: GitHub validates a reusable workflow's nested-job
# permissions against the caller job's grant statically, when parsing the
# workflow, and ignores the nested jobs' `if:` conditions
# (runner `PermissionsHelper.ValidateEmbeddedPermissions`). The gate needs
# `issues: write` + `pull-requests: write` (comment + label), so it must not
# share a file with a read-only job that callers grant only read to (that
# is why the weekly tally has its own file, `pr-size-weekly.yml`).
# `.github/scripts/test_pr_size_workflows.py` pins that caller-grant >=
# reusable-request contract for the shipped template.
#
# Token: no secrets are passed or needed. The job's GITHUB_TOKEN is minted
# for the caller's repository and capped by the caller's job permissions,
# so callers of THIS file grant `issues: write` + `pull-requests: write`.
# Never pass `secrets: inherit` to this workflow.

name: pr-size-gate (reusable)

on:
  workflow_call:
    inputs:
      pr-number:
        description: >-
          Pull request to gate. Empty means the pull request that triggered
          the caller (`github.event.pull_request.number`).
        required: false
        default: ""
        type: string
      exclude-extra:
        description: >-
          Comma-separated extra exclusion globs for the caller's generated
          paths, on top of the script's built-in lockfile/generated/fixture
          list (e.g. "public/bundles/**,drizzle/meta/**").
        required: false
        default: ""
        type: string
      # No threshold inputs by design: the reviewability budget (400
      # lines / 20 files / 1,000 hard stop) is fixed below. A caller that
      # could set those values could exempt its own pull requests, so the
      # gate would no longer be a gate.
      runs-on:
        description: >-
          JSON runner label(s), e.g. '["ubuntu-latest"]'.
        required: false
        default: '["ubuntu-latest"]'
        type: string

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Fixed central source, independent of the caller's repository/ref.
      # This reviewed main commit carries the gate mode of the script.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: TogetherWeOwn/.github
          ref: d84fd26345866c493dd7e6349d3f4b72e28211d1
          path: .pr-size-central
          sparse-checkout: .github/scripts/pr_size.py
          persist-credentials: false

      - name: Gate the pull request size (required)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number != '' && inputs.pr-number || github.event.pull_request.number }}
          PR_SIZE_GATE_THRESHOLD: "400"
          PR_SIZE_GATE_FILES: "20"
          PR_SIZE_HARD_STOP: "1000"
          PR_SIZE_EXCLUDE_EXTRA: ${{ inputs.exclude-extra }}
        run: python3 .pr-size-central/.github/scripts/pr_size.py gate
