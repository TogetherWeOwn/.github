rules:
- id: ts-browser-global-secret-headers
  languages:
  - typescript
  - javascript
  message: 'TS-008a: global browser credentials reach cross-origin subresources; use per-origin credentials
    and a trap test.'
  severity: ERROR
  metadata:
    examples:
    - nntunev2#11 access-headers-cross-origin
    - nntunev2#11 api-clients-forward-credentials-on-redirect
    confidence: LOW
    mode: shadow
    category: correctness
    proof: Advisory static signal; confirm with the named behavioral test before promotion.
  pattern-either:
  - pattern: '{extraHTTPHeaders: {Authorization: $V, ...}, ...}'
  - pattern: '{extraHTTPHeaders: {"CF-Access-Client-Secret": $V, ...}, ...}'
  - pattern: '$C.setExtraHTTPHeaders({Authorization: $V, ...})'
  - pattern: '$C.setExtraHTTPHeaders({Cookie: $V, ...})'
