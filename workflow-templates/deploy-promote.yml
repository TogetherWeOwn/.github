name: deploy

# TogetherWeOwn pipeline standard §3: staging deploys every green main push; production PROMOTES the last green
# staging SHA. It never demands the newest main SHA and never needs a main freeze.
# Production uses the org reusable workflow .github/workflows/promote-staging.yml (TogetherWeOwn/.github), pinned
# by SHA. Replace the two placeholder deploy steps with the repo's real deploy (wrangler, container, ...).

on:
  push:
    branches: [ $default-branch ]
  workflow_dispatch:
    inputs:
      target:
        description: "staging | production"
        required: true
        default: production
      sha:
        description: "Optional: a specific staged SHA to promote (default: last green staging deploy)"
        required: false

permissions:
  contents: read
  actions: read

jobs:
  deploy-staging:
    if: github.event_name == 'push' || inputs.target == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    # One staging deploy at a time; a queued newer push replaces an older QUEUED one (never the running one).
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy to staging (replace)
        run: echo "deploy ${GITHUB_SHA} to staging"

  promote-production:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    # Pin by SHA when adopting.
    uses: TogetherWeOwn/.github/.github/workflows/promote-staging.yml@main
    with:
      staging-workflow: deploy
      staging-job: deploy-staging
      environment: production
      sha: ${{ inputs.sha }}
    secrets: inherit
