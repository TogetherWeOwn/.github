rules:
- id: shell-secret-sed-argv
  languages:
  - bash
  message: 'PYCI-04a: expanded secret in sed argv is visible in process listings; read env/file inside
    the process.'
  severity: ERROR
  metadata:
    examples:
    - paperclip-ops-tooling#835 recon-sed-argv-key-leak
    confidence: LOW
    mode: shadow
    category: correctness
    proof: Advisory static signal; confirm with the named behavioral test before promotion.
  pattern-regex: \bsed\b[^\n]*["\'][^\n]*\$\{?(?:[A-Z_]*(?:KEY|SECRET|TOKEN|PASSWORD))[A-Z_]*(?:\}|[^A-Za-z_])
