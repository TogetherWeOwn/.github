# Reusable advisory pull-request size labeller for the org CI standard.
#
# Lives in the org `.github` repo at `.github/workflows/pr-size.yml`.
# Callers reference a pinned SHA and pass only their generated paths:
#   uses: TogetherWeOwn/.github/.github/workflows/pr-size.yml@<sha>
#   with:
#     exclude-extra: "generated/**,snapshots/**"
# Starter caller: `workflow-templates/pr-size.yml`. Standard: the
# "Advisory PR-size labels" section of CI-STANDARD.md.
#
# ADVISORY ONLY. This workflow is never a required check and must never be
# added to a ruleset's required-workflows list (that would make it block
# merges). The labeller exits 0 on any API failure, and an unknown `mode`
# skips both jobs, so even a miswired caller cannot turn a pull request red.
#
# The labelling logic lives ONCE in `.github/scripts/pr_size.py` next to
# this file. Each job checks out THIS repository at the reusable workflow's
# own ref (`job.workflow_repository` / `job.workflow_sha`), never the
# caller's pull-request head: a pull request cannot run its own modified
# labeller, and cannot silence its own label by deleting the script.
# Thresholds are fixed centrally in the script (size/S <= 100, size/M <= 400,
# size/L <= 1000 counted lines, size/XL above that) and are not inputs.
#
# Token: no secrets are passed or needed. The job's GITHUB_TOKEN is minted
# for the caller's repository and capped by the caller's job permissions,
# so callers grant `issues: write` + `pull-requests: write` for label mode
# and read-only for weekly mode (see the template). Never pass
# `secrets: inherit` to this workflow.
#
# Weekly tally: the schedule stays in the CALLER (a reusable workflow has
# no schedule of its own for caller repositories, and the tally is
# per-repository); this workflow only supplies `mode: weekly`.

name: pr-size (reusable)

on:
  workflow_call:
    inputs:
      mode:
        description: "'label' (one PR) or 'weekly' (tally of the last 7 days)."
        required: false
        default: "label"
        type: string
      pr-number:
        description: >-
          Pull request to label. Empty means the pull request that triggered
          the caller (`github.event.pull_request.number`).
        required: false
        default: ""
        type: string
      exclude-extra:
        description: >-
          Comma-separated extra exclusion globs for the caller's generated
          paths, on top of the script's built-in lockfile/generated/fixture
          list (e.g. "public/bundles/**,drizzle/meta/**").
        required: false
        default: ""
        type: string
      runs-on:
        description: >-
          JSON runner label(s), e.g. '["ubuntu-latest"]' or
          '["self-hosted","linux"]' for a private caller repository.
        required: false
        default: '["ubuntu-latest"]'
        type: string

permissions:
  contents: read

jobs:
  label:
    name: label
    if: inputs.mode == 'label'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # The labeller from this workflow's own repository and ref - never
      # the caller's checkout, never the pull request's head.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pr-size-central
          sparse-checkout: .github/scripts/pr_size.py
          persist-credentials: false

      - name: Label the pull request (advisory)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number != '' && inputs.pr-number || github.event.pull_request.number }}
          # Fixed centrally: counted lines above this post the advisory
          # comment. Matches the size/M cap in pr_size.py (SIZES).
          PR_SIZE_THRESHOLD: "400"
          PR_SIZE_EXCLUDE_EXTRA: ${{ inputs.exclude-extra }}
        run: python3 .pr-size-central/.github/scripts/pr_size.py label

  weekly:
    name: weekly
    if: inputs.mode == 'weekly'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pr-size-central
          sparse-checkout: .github/scripts/pr_size.py
          persist-credentials: false

      - name: Weekly size tally (advisory)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .pr-size-central/.github/scripts/pr_size.py weekly
