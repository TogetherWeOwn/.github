# Reusable REQUIRED pull-request size gate for the org CI standard.
#
# Lives in the org `.github` repo at `.github/workflows/pr-size-gate.yml`.
# Callers reference a pinned SHA and pass only their generated paths:
#   uses: TogetherWeOwn/.github/.github/workflows/pr-size-gate.yml@<sha>
#   with:
#     exclude-extra: "generated/**,snapshots/**"
# Starter caller: `workflow-templates/pr-size.yml`. Standard: the
# "PR size gate" section of STANDARD.md (the split procedure lives there).
#
# REQUIRED CHECK. Unlike the advisory labeller (`pr-size.yml`), this gate
# FAILS when the reviewable diff exceeds the automated reviewer's limit, so
# an over-limit pull request fails here instead of wasting a review cycle on
# a refusal later. The gate fails closed: if the size cannot be measured,
# the run errors instead of passing silently. Adopters add this check to
# their ruleset's required-workflows list once the caller workflow is on
# their default branch (STANDARD.md rule: never require a check before its
# workflow exists there).
#
# Threshold (default input `gate-threshold`, 20,000 counted lines, where
# counted = additions + deletions after the script's lockfile / generated /
# fixture exclusions). Measured 2026-11-11 across the rollout repositories
# from their pull requests' Devin Review commit statuses:
#   - Reviewed OK: labelloop#12 (35,226 raw lines), nntunev2#957 (28,095),
#     paperclip-plugin-vuln-sentinel#1 (21,957), two-web-next#2004 (18,119),
#     plus a dozen more at 10k-15k raw lines.
#   - Refused: nntunev2#908 (47,982 raw lines, +47,945/-37, 140 files) -
#     Devin Review failed in 3 seconds (instant refusal; genuine reviews
#     take minutes). Draft pull requests carry no Devin status at all
#     (Devin does not run on drafts), so they are not evidence either way.
# Devin's documented limit is unknown, so the boundary is known only as
# between ~35k raw lines (reviewed) and ~48k raw lines (refused). 20,000
# counted lines is a conservative margin below that refusal point, and the
# counted total is always <= the raw total, so the gate never lets through
# a diff Devin is known to refuse. Pull requests above the gate that cannot
# be split use the exception below; review-driven growth that trips the gate
# is handled by splitting or by the exception, never by raising the
# threshold for one repo.
#
# Exception: a pull request over the gate passes only with the
# `size-exception` label AND an APPROVED review from someone other than the
# author. Even then, Devin must still be satisfied via review slices for
# the over-limit diff (STANDARD.md "PR size gate"). The script ensures the
# label exists so authors can apply it themselves.
#
# The gating logic lives ONCE in `.github/scripts/pr_size.py` next to this
# file. The job checks out THIS repository at an explicit, reviewed
# main-branch commit, never a caller context or pull-request head: a pull
# request cannot run its own modified gate. When the script changes, commit
# it first, then repin ALL THREE reusable workflows to that reviewed
# main-branch SHA.
#
# Why its own file: GitHub validates a reusable workflow's nested-job
# permissions against the caller job's grant statically, when parsing the
# workflow, and ignores the nested jobs' `if:` conditions
# (runner `PermissionsHelper.ValidateEmbeddedPermissions`). The gate needs
# `issues: write` + `pull-requests: write` (comment + label), so it must not
# share a file with a read-only job that callers grant only read to (that
# is why the weekly tally has its own file, `pr-size-weekly.yml`).
# `.github/scripts/test_pr_size_workflows.py` pins that caller-grant >=
# reusable-request contract for the shipped template.
#
# Token: no secrets are passed or needed. The job's GITHUB_TOKEN is minted
# for the caller's repository and capped by the caller's job permissions,
# so callers of THIS file grant `issues: write` + `pull-requests: write`.
# Never pass `secrets: inherit` to this workflow.

name: pr-size-gate (reusable)

on:
  workflow_call:
    inputs:
      pr-number:
        description: >-
          Pull request to gate. Empty means the pull request that triggered
          the caller (`github.event.pull_request.number`).
        required: false
        default: ""
        type: string
      exclude-extra:
        description: >-
          Comma-separated extra exclusion globs for the caller's generated
          paths, on top of the script's built-in lockfile/generated/fixture
          list (e.g. "public/bundles/**,drizzle/meta/**").
        required: false
        default: ""
        type: string
      gate-threshold:
        description: >-
          Counted lines above which the gate fails without a
          `size-exception` (default 20000, the org-measured limit with
          margin; do not raise it per-repository).
        required: false
        default: "20000"
        type: string
      runs-on:
        description: >-
          JSON runner label(s), e.g. '["ubuntu-latest"]'.
        required: false
        default: '["ubuntu-latest"]'
        type: string

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Fixed central source, independent of the caller's repository/ref.
      # This reviewed main commit carries the gate mode of the script.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: TogetherWeOwn/.github
          ref: 5159cb07e60af722b5f3e7d63f9f126957681dcc
          path: .pr-size-central
          sparse-checkout: .github/scripts/pr_size.py
          persist-credentials: false

      - name: Gate the pull request size (required)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number != '' && inputs.pr-number || github.event.pull_request.number }}
          PR_SIZE_GATE_THRESHOLD: ${{ inputs.gate-threshold }}
          PR_SIZE_EXCLUDE_EXTRA: ${{ inputs.exclude-extra }}
        run: python3 .pr-size-central/.github/scripts/pr_size.py gate
