name: zap-staging

# OWASP ZAP passive baseline of a STAGING site (CI-STANDARD rule 24). Call it
# from the post-deploy staging workflow (`uses: ./.github/workflows/zap-staging.yml`)
# so a failure blocks promotion, and let the schedule catch drift. Add a gate
# script that fails on any High and on Medium/Low above a committed budget, and
# prints alert names and counts only (public repos: never upload the report).

on:
  workflow_call:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: zap-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET: https://staging.example.com # staging only; enforced by the guard step below
      STAGING_ORIGIN: https://staging.example.com # the one allowed origin; set both together
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:7aaa659b0d43078febd82e29bad112285c370727e86ab8340444220e17d9f0d2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Staging-only target guard
        run: |
          set -euo pipefail
          [ "$TARGET" = "$STAGING_ORIGIN" ] || { echo "refusing non-staging target: $TARGET"; exit 1; }
      - name: ZAP baseline (passive)
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/zap" && chmod 777 "$RUNNER_TEMP/zap"
          docker run --rm -v "$RUNNER_TEMP/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "$TARGET" -J zap-report.json -I -m 3 >/dev/null 2>&1
          rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then echo "zap-baseline.py exited $rc"; exit 1; fi
          test -s "$RUNNER_TEMP/zap/zap-report.json"
      - name: Gate
        run: node ci/zap-gate.mjs "$RUNNER_TEMP/zap/zap-report.json" ci/zap-budget.json
