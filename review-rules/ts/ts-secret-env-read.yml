rules:
- id: ts-secret-env-read
  languages:
  - typescript
  - javascript
  message: 'TS-001: credential env read requires denylist parity; this signal alone does not establish
    a missing entry.'
  severity: WARNING
  metadata:
    examples:
    - paperclip#49 secret-denylist-missing-xai-bedrock
    - paperclip#58 denylist-missing-managed-provider-key
    confidence: LOW
    mode: shadow
    category: correctness
    proof: Advisory static signal; confirm with the named behavioral test before promotion.
  patterns:
  - pattern-either:
    - pattern: process.env.$KEY
    - pattern: process.env["$KEY"]
    - pattern: Deno.env.get($KEY)
    - pattern: import.meta.env.$KEY
  - metavariable-regex:
      metavariable: $KEY
      regex: (?i).*(API_KEY|API_TOKEN|_TOKEN|PROVIDER_KEY|BEDROCK|XAI|GROK|PAPERCLIP_.*KEY).*
  paths:
    include:
    - '**/server/src/**'
    - '**/packages/adapter-utils/**'
    - '**/apps/web/src/env*'
