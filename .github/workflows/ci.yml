# CI for the org `.github` repo (org CI standard, first adopter).
#
# Adopted from `workflow-templates/starter-ci.yml`, pinned to the reusable
# `changes.yml` detector at 773ee91a904b9e1b65eddaaad4400d36e05fa717.
# Retain fix/checkout-credential-source across squash; normalize to main afterward.
# Areas are tuned to this repo: template edits run web checks, script edits run
# bot checks, markdown-only edits skip both, and everything else runs everything.
#
# What this wires in:
#   * `changes` job (reusable workflow): per-area booleans, full-run flag.
#   * Job-level `if:` gating: heavy jobs run only when their area changed
#     or when `full_run` is true. NEVER add workflow-level `on: pull_request:
#     paths:` to this file: it would suppress the required `ci-ok` check.
#   * `tier-0` job (same-repo reusable workflow): the Tier-0 deterministic
#     quality gate dogfooding this repo report-only, fed into `ci-ok`.
#   * One required aggregator `ci-ok` (`if: always()` over every gated job).
#     Of the CI jobs, branch protection requires only `ci-ok` (plus pr-lint,
#     secret scan); it also requires `Devin Review`. CodeRabbit is advisory,
#     never a required check.
#   * Full suite on `push` to `main` and on the nightly schedule.
#   * Cheap/security jobs (lint, secrets, ci-ok) always run.
#   * Concurrency cancels superseded PR runs only; timeouts on every job;
#     drafts skip heavy jobs on PR events only (force/full-run first) while
#     `ci-ok` still reports (rules 9-10).
#   * Stack caches, sharding, flake quarantine, mutation/E2E/security
#     cadences and governance budgets live in CI-STANDARD.md rules 12-20;
#     wire them via the org reusable stack workflows, not inline here.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group: {}
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # nightly full run (safety net)
  workflow_dispatch: {}

# A shared non-PR group would still cancel older PENDING runs, even with
# cancel-in-progress: false. Unique run IDs preserve main/nightly/queue runs.
# Source: https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Adjust the `changes` inputs to the repo's layout. These use fnmatchcase,
# not recursive globstar: **/package.json cannot match root package.json.
# Keep explicit root + nested dependency manifests and lockfiles for each stack.
# npm-shrinkwrap.json supersedes package-lock.json; both must force a full run.
# Shared workspace/build config forces full CI even inside a matched code area.
# Any unclassified path also forces full CI; extend the area map deliberately.
# Source: https://docs.npmjs.com/cli/v11/configuring-npm/npm-shrinkwrap-json

jobs:
  changes:
    name: changes
    uses: TogetherWeOwn/.github/.github/workflows/changes.yml@773ee91a904b9e1b65eddaaad4400d36e05fa717
    with:
      areas-json: '{"web":["workflow-templates/**"],"bot":[".github/scripts/**"],"docs":["**.md","docs/**"]}'
      full-run-globs-json: '["package.json","**/package.json","package-lock.json","**/package-lock.json","npm-shrinkwrap.json","**/npm-shrinkwrap.json","pnpm-lock.yaml","**/pnpm-lock.yaml","yarn.lock","**/yarn.lock","Gemfile","**/Gemfile","Gemfile.lock","**/Gemfile.lock","Cargo.toml","**/Cargo.toml","Cargo.lock","**/Cargo.lock","go.mod","**/go.mod","go.sum","**/go.sum","pyproject.toml","**/pyproject.toml","poetry.lock","**/poetry.lock","uv.lock","**/uv.lock","requirements*.txt","**/requirements*.txt","requirements*.in","**/requirements*.in","setup.py","**/setup.py","setup.cfg","**/setup.cfg","Pipfile","**/Pipfile","Pipfile.lock","**/Pipfile.lock","composer.json","**/composer.json","composer.lock","**/composer.lock","pnpm-workspace.yaml","**/pnpm-workspace.yaml","go.work","**/go.work","go.work.sum","**/go.work.sum","tsconfig*.json","**/tsconfig*.json","jsconfig*.json","**/jsconfig*.json",".cargo/**","**/.cargo/**","rust-toolchain*","**/rust-toolchain*",".npmrc","**/.npmrc",".yarnrc*","**/.yarnrc*","Makefile*","**/Makefile*","CMakeLists.txt","**/CMakeLists.txt",".github/**","shared/**","common/**","build/**","Dockerfile*","**/Dockerfile*","docker-compose*.yml","**/docker-compose*.yml"]'
      docs-areas-json: '["docs"]'

  # Full suite on main pushes and the nightly schedule, even if the diff
  # looks small. PRs rely on gating; main never skips.
  full_run:
    name: full run context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      force: ${{ steps.ctx.outputs.force }}
    steps:
      - id: ctx
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: echo "lint goes here (always runs)"

  test-web:
    name: test web
    needs: [changes, full_run]
    if: needs.full_run.outputs.force == 'true' || needs.changes.outputs.full_run == 'true' || (fromJSON(needs.changes.outputs.areas).web && (github.event_name != 'pull_request' || github.event.pull_request.draft == false))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: echo "web tests go here"

  test-bot:
    name: test bot
    needs: [changes, full_run]
    if: needs.full_run.outputs.force == 'true' || needs.changes.outputs.full_run == 'true' || (fromJSON(needs.changes.outputs.areas).bot && (github.event_name != 'pull_request' || github.event.pull_request.draft == false))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: echo "bot tests go here"

  secret-scan:
    name: secret scan
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: echo "secret scan goes here (always runs)"

  # Tier-0 dogfood (report-only): the reusable deterministic quality gate
  # running against this repo's own diff, so the 20-PR false-positive
  # measurement starts here. Same-repo caller, so no SHA to pin — and no
  # timeout-minutes/runs-on on a uses: job (GitHub rejects them there);
  # timeouts live inside the reusable workflow. Change-gated and
  # draft-guarded like the other heavy jobs (Gate 6 budgets 30 minutes).
  # Workspace-relative ./ (not the newer $/ self-repository form):
  # actionlint 1.7.12 rejects $/ in uses:, so ./ stays until it parses.
  tier-0:
    name: tier-0 (report-only dogfood)
    needs: [changes, full_run]
    if: needs.full_run.outputs.force == 'true' || needs.changes.outputs.full_run == 'true' || (needs.changes.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false))
    uses: ./.github/workflows/tier-0-quality-gate.yml
    with:
      mode: report-only
    permissions:
      contents: read

  # The test-guard wrapper and both changes callers pin reusable sources;
  # a forgotten repin means CI keeps exercising stale code. Light and
  # always-on (no paths filter — this job feeds required `ci-ok`).
  pincheck:
    name: pincheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the hash-pinned workflow parser
        id: yaml-dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/pincheck-python"
          "$RUNNER_TEMP/pincheck-python/bin/python" -m pip download --require-hashes --only-binary=:all: --disable-pip-version-check -r .github/scripts/requirements-pincheck.txt --dest "$RUNNER_TEMP/pincheck-wheels"
          "$RUNNER_TEMP/pincheck-python/bin/python" -m pip install --no-index --find-links "$RUNNER_TEMP/pincheck-wheels" --require-hashes --only-binary=:all: --disable-pip-version-check -r .github/scripts/requirements-pincheck.txt
          echo "$RUNNER_TEMP/pincheck-python/bin" >> "$GITHUB_PATH"
      - name: Wrapper pin must carry the current reusable
        run: |-
          PIN="$(grep -o 'test-guard\.yml@[0-9a-f]\{40\}' .github/workflows/test-guard-required.yml | head -1 | cut -d@ -f2)"
          if [ -z "$PIN" ]; then
            echo "::error::test-guard-pincheck: no pinned test-guard.yml@<sha> in test-guard-required.yml"
            exit 1
          fi
          # The pin may name a commit on the PR branch; make sure it is
          # present before diffing so a missing object reads as a repin
          # request, not `fatal: bad object`. After a squash-merge with
          # branch deletion, repin to the merge commit on main.
          git fetch origin "$PIN" 2>/dev/null || true
          if ! git cat-file -e "$PIN^{commit}" 2>/dev/null; then
            echo "::error::test-guard-pincheck: pin $PIN is not fetchable (branch deleted?) — repin uses: to a commit on main carrying the reusable"
            exit 1
          fi
          if ! git diff --quiet "$PIN" HEAD -- .github/workflows/test-guard.yml; then
            echo "::error::test-guard-pincheck: wrapper pins $PIN but the reusable changed since; repin uses: to the commit carrying the reusable (see TEST-GUARD.md step 4)"
            exit 1
          fi
          echo "test-guard-pincheck: pin $PIN carries the current reusable"
      - name: Changes callers must carry the current reusable
        run: python3 -I .github/scripts/check_changes_pins.py
      - name: Tier-0 self-pin must carry the current gate files
        run: |-
          PIN="$(grep -o 'TIER0_SELF_PIN: "[0-9a-f]\{40\}"' .github/workflows/tier-0-quality-gate.yml | head -1 | cut -d'"' -f2)"
          if [ -z "$PIN" ]; then
            echo "::error::tier-0-pincheck: no TIER0_SELF_PIN: \"<sha>\" in tier-0-quality-gate.yml"
            exit 1
          fi
          # Same repin flow as test-guard: the pin may name a commit on the
          # PR branch; after a squash-merge with branch deletion, repin to
          # the merge commit on main.
          git fetch origin "$PIN" 2>/dev/null || true
          if ! git cat-file -e "$PIN^{commit}" 2>/dev/null; then
            echo "::error::tier-0-pincheck: pin $PIN is not fetchable (branch deleted?) — repin TIER0_SELF_PIN to a commit on main carrying semgrep-rules/ and tier0/"
            exit 1
          fi
          if ! git diff --quiet "$PIN" HEAD -- semgrep-rules tier0; then
            echo "::error::tier-0-pincheck: pin $PIN is stale for semgrep-rules/ or tier0/; repin TIER0_SELF_PIN to the commit carrying them"
            exit 1
          fi
          echo "tier-0-pincheck: pin $PIN carries the current gate files"

  # Regression tests for the embedded test-guard gate (see the script).
  # Light (~30s) and always-on so gate changes can never merge red.
  gate-selftest:
    name: gate selftest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the hash-pinned workflow parser
        id: yaml-dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/pincheck-python"
          "$RUNNER_TEMP/pincheck-python/bin/python" -m pip download --require-hashes --only-binary=:all: --disable-pip-version-check -r .github/scripts/requirements-pincheck.txt --dest "$RUNNER_TEMP/pincheck-wheels"
          "$RUNNER_TEMP/pincheck-python/bin/python" -m pip install --no-index --find-links "$RUNNER_TEMP/pincheck-wheels" --require-hashes --only-binary=:all: --disable-pip-version-check -r .github/scripts/requirements-pincheck.txt
          echo "$RUNNER_TEMP/pincheck-python/bin" >> "$GITHUB_PATH"
      - run: bash .github/scripts/test-guard-selftest.sh
      - name: Checkout credentials and offline change-detection contracts
        run: python3 -I .github/scripts/test_checkout_credentials.py
      - name: Required reusable pincheck regressions
        run: python3 -I .github/scripts/test_changes_pins.py
      - name: Public PR security gate regressions (offline fixtures, no target scans)
        run: |
          python3 -I security-gate/test_gate.py
          python3 -I security-gate/test_workflow.py
      - name: Label-sync script contract (fake gh, never deletes)
        run: python3 -I .github/scripts/test_sync_labels.py
      - name: Org standard and ruleset source contracts (read-only)
        run: python3 -I ci/test_org_standard.py
      # Fetch/check the pinned source object before acceptance inspects it;
      # preserve the existing shallow checkout/credential contract.
      - name: CalVer caller pins carry the current tooling
        run: node actions/calver/check-pins.mjs
      - name: CalVer engine and adapter acceptance tests (required)
        run: node --test ci/calver*.test.mjs

  # Unit tests for the org PR-size script: the advisory labeller, the
  # weekly tally and the REQUIRED gate mode (stdlib unittest, seconds),
  # plus the static checks that every caller job in the shipped template
  # grants at least the permissions its reusable file requests, and that
  # every reusable checks the script out from the reviewed central source
  # (GitHub rejects an under-granting caller at parse time, which no
  # executing job here could catch). Always-on like gate-selftest so
  # pr-size changes can never merge red.
  pr-size-selftest:
    name: pr-size selftest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s .github/scripts -p 'test_pr_size*.py'

  # Behaviour tests for the org-required pr-standards check (stdlib unittest,
  # seconds). They run the exact heredoc from pr-standards-required.yml.
  # Always-on so the enforced gate can never merge red.
  pr-standards-selftest:
    name: pr-standards selftest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: test_hosted_runners reads every pinned reusable
          # revision (pins on no branch are fetched by sha).
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -p 'test_pr_standards_required.py'
      # Every workflow here, and every pinned reusable revision, must run on
      # GitHub-hosted runners: a required check whose runner never starts
      # blocks every merge.
      - run: python3 -m unittest discover -s .github/scripts -p 'test_hosted_runners.py'

  # Regression tests for the Tier-0 reusable gate: the structural shell
  # contract, the file/tool hermetic suites, and the real-scanner suite
  # against the pinned Semgrep. Light and always-on (no paths filter —
  # this job feeds required `ci-ok`) so a gate regression can never
  # merge green.
  tier-0-selftest:
    name: tier-0 selftest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the hashed selftest pins
        run: |
          set -euo pipefail
          # A venv, not user-site: the scanner suite scrubs HOME, which hides
          # user-site modules from the semgrep entry point. Every package is
          # hashed (--require-hashes), and installing the security file also
          # proves the gate's own pins install. Outside the workspace so no
          # suite walks it.
          venv="$RUNNER_TEMP/tier0-selftest-venv"
          # Semgrep 1.133.0 declares Python >=3.9; the retained dependency
          # lock requires >=3.12. Use hosted Python 3.12, not PATH's 3.14.
          python3.12 -m venv "$venv"
          "$venv/bin/pip" install --disable-pip-version-check --require-hashes -q -r tier0/requirements-security.txt -r tier0/requirements-selftest.txt 2>&1 | tail -1
          echo "$venv/bin" >> "$GITHUB_PATH"
      - name: Structural contract and hermetic suites
        run: |
          set -euo pipefail
          bash test_tier0_gate.sh
          python3 -m unittest test_tier0_files test_tier0_tools
      - name: Real-scanner suite with the pinned Semgrep
        run: |
          set -euo pipefail
          export SEMGREP_BIN="$RUNNER_TEMP/tier0-selftest-venv/bin/semgrep"
          command -v semgrep
          semgrep --version
          python3 -m unittest -v test_tier0_semgrep

  gradual-promote-selftest:
    name: gradual-promote selftest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout the caller smoke checker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: TogetherWeOwn/two-web-next
          ref: d09b4bee57ad7effdaa79d0765574c3a60e8068e
          path: two-web-next
          persist-credentials: false
      # Match immutable consumers without adding dependencies to the action.
      # npm 11.19 supports the native three-day age and script-refusal controls.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Install the locked consumer formatter (no lifecycle scripts)
        working-directory: ci/formatting
        run: |
          test "$(npm config get ignore-scripts)" = true
          test "$(npm config get min-release-age)" = 3
          npm ci --ignore-scripts --min-release-age=3 --no-audit --no-fund
      - name: Run gradual promotion self-tests and producer formatting regression
        run: node --test ci/gradual-promote.test.mjs ci/gradual-promote-gate-acceptance.test.mjs ci/gradual-promote-action.test.mjs ci/gradual-promote-format.test.mjs
        env:
          TWO_WEB_NEXT_ROOT: two-web-next

  # New attestation development checks are observable but non-blocking during
  # shadow. Deliberately not added to ci-ok needs; existing required gates stay
  # unchanged. This tests policy code, not the target PR's test claims.
  pr-attestation-selftest:
    name: pr-attestation selftest (shadow)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Parser, API and workflow regression tests
        id: tests
        continue-on-error: true
        run: |
          python3 -I .github/scripts/test_pr_attestation.py
          python3 -I .github/scripts/test_pr_attestation_workflows.py
          python3 -I .github/scripts/check_pr_attestation_pins.py
      - name: Surface self-test failure without changing required CI
        if: always() && steps.tests.outcome != 'success'
        run: printf '%s\n' '::warning::PR attestation shadow self-tests did not succeed; investigate before rollout.'

  ci-ok:
    name: ci-ok
    needs: [changes, full_run, lint, test-web, test-bot, secret-scan, pincheck, gate-selftest, pr-size-selftest, pr-standards-selftest, tier-0-selftest, gradual-promote-selftest, tier-0]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          python3 -I - "$NEEDS_JSON" <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v.get("result") for k, v in needs.items()
                 if v.get("result") not in ("success", "skipped")}
          if bad:
              print(f"failing jobs: {bad}")
              sys.exit(1)
          print("ci-ok: every needed job succeeded or was skipped")
          EOF
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
