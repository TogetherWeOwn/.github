# Org-ruleset entry point: select this file as a required workflow in the
# org ruleset so every TogetherWeOwn repo, current and future, runs it with
# no per-repo copy. The bare `pr-standards` check is an enforced gate.
#
# Always an error (title and body, every PR, public or private):
#   * an internal tracker id (TWO-123, TOG-123, PAP-123, PAPA-123; any case,
#     `-` or `_`), a Paperclip instance UI link, the internal host or a
#     private-network (RFC 1918 / CGNAT) address (a loopback address such as
#     localhost:3000 or 127.0.0.0/8 only warns: it names no machine of ours);
#   * a PR title that is not a Conventional Commits header (warning only on
#     forks of upstream projects and on dependabot/renovate PRs).
# Branch name and commit messages: the same internal-reference check is an
# error for PRs opened after ENFORCE_SINCE, a warning on older PRs (their
# branches and commits predate the rule; titles and bodies were cleaned).
# Automated-review threads: every Devin Review thread needs a reply in that
# thread whose first line is `Fixed in <sha>`, `Rejected: <proof>` or
# `Duplicate of <link>` (an error for PRs opened after REVIEW_ENFORCE_SINCE;
# a warning on drafts, dependabot/renovate PRs, fork-head PRs and older
# PRs). Resolving a conversation is not an answer, and Devin's own
# follow-up comments do not count. CodeRabbit stays advisory and is not
# gated here. The step reads the threads when it runs, so a reply posted
# after the last push is seen at the next run (push a commit, or close and
# reopen the PR). See CONTRIBUTING.md §4.
# Same rule as paperclipai/paperclip CONTRIBUTING "No Internal Issue
# References" and "Branch Naming"; see CONTRIBUTING.md §2 in this repo.
# Self-tests: .github/scripts/test_pr_standards_required.py (ci.yml).
name: PR standards (required entry point)

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-standards-required-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-standards:
    name: pr-standards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check title, body, branch and commit messages
        env:
          ENFORCE_SINCE: "2026-11-02T00:00:00Z"
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          CREATED_AT: ${{ github.event.pull_request.created_at }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_COUNT: ${{ github.event.pull_request.commits }}
          REPO_FORK: ${{ github.event.repository.fork }}
          COMMITS_URL: ${{ github.event.pull_request.commits_url }}
          GH_TOKEN: ${{ github.token }}
        run: |-
          python3 -I - <<'PYEOF'
          import json, os, re, sys, urllib.request

          TYPES = "feat|fix|perf|refactor|test|docs|build|ci|chore|revert|style|security"
          HEADER = re.compile(rf"^({TYPES})(\([A-Za-z0-9._/,-]+\))?!?: \S.*$")
          TRACKER_ID = re.compile(r"(?<![A-Za-z0-9])(?:TWO|TOG|PAPA|PAP)[-_]\d+(?![0-9])", re.IGNORECASE)
          # Instance-link and github.com patterns match workflow-templates/pr-lint.yml.
          UI_LINK_BARE = re.compile(r"(?<![\w.-])/[A-Z]{2,6}/(issues|agents|projects|approvals|runs)/")
          UI_LINK_HOST = re.compile(r"(?:https?://[^\s/<>()]+|(?<![\w./-])[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+(?::\d+)?)/[A-Z]{2,6}/(issues|agents|projects|approvals|runs)/")
          INTERNAL_HOST = re.compile(r"\binfextion\.net\b", re.IGNORECASE)
          # Bare "localhost" in prose is fine; a URL or host:port is not.
          LOCAL_URL = re.compile(r"(?:https?://(?:localhost|0\.0\.0\.0)(?![\w.-])|(?<![\w.-])(?:localhost|0\.0\.0\.0)(?::\d+|/))", re.IGNORECASE)
          OCTET = r"(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)"
          LOOPBACK_IP = re.compile(rf"(?<![\w.])127(?:\.{OCTET}){{3}}(?![\w.])")
          PRIVATE_IP = re.compile(rf"(?<![\w.])(?:10(?:\.{OCTET}){{3}}|192\.168(?:\.{OCTET}){{2}}"
                                  rf"|172\.(?:1[6-9]|2\d|3[01])(?:\.{OCTET}){{2}}"
                                  rf"|100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])(?:\.{OCTET}){{2}})(?![\w.])")
          # Only a real github.com host is exempt (not notgithub.com/...).
          GITHUB_URL = re.compile(r"(?:https?://|(?<![\w.-]))(?:www\.)?github\.com/[A-Za-z0-9_.~%/#?=&+\-]*", re.IGNORECASE)
          CHECKS = [(TRACKER_ID, "an internal tracker id"), (UI_LINK_BARE, "a Paperclip instance link"),
                    (UI_LINK_HOST, "a Paperclip instance link"), (INTERNAL_HOST, "the internal host")]
          # Upstream text (dependabot/renovate release notes, fork-sync commits) often names
          # private addresses, so these only warn on bot and fork PRs.
          ADDRESS_CHECKS = [(PRIVATE_IP, "a private-network address")]
          # Loopback names no machine of ours, and fixes that handle it must say so
          # (`refuse non-loopback origins`, `127.0.0.0/8`), so it only ever warns.
          LOOPBACK_CHECKS = [(LOCAL_URL, "a localhost address"), (LOOPBACK_IP, "a loopback address")]
          HELP = ("Say it in plain words, link only public GitHub issues (Fixes #123), name the "
                  "branch after the change (fix/quota-template-pin), and link the card from "
                  "Paperclip, never from GitHub. See TogetherWeOwn/.github CONTRIBUTING.md §2.")

          def hits(text, checks=CHECKS + ADDRESS_CHECKS + LOOPBACK_CHECKS):
              scrubbed = GITHUB_URL.sub("", re.sub(r"<!--.*?-->", "", text or "", flags=re.S))
              found = []
              for pat, label in checks:
                  m = pat.search(scrubbed)
                  if m and not any(f.startswith(label) for f in found):
                      found.append(f"{label} ('{m.group(0)}')")
              return found

          def header_errors(text):
              errs = []
              if not HEADER.match(text):
                  errs.append("not a Conventional Commits header")
              if len(text) > 100:
                  errs.append(f"{len(text)} chars (max 100)")
              if text.rstrip().endswith("."):
                  errs.append("ends with a period")
              return errs

          def commit_messages():
              if "COMMITS_JSON" in os.environ:  # self-tests
                  return json.loads(os.environ["COMMITS_JSON"])
              out = []
              for page in range(1, 4):  # the API returns at most 250 commits; see COMMIT_COUNT
                  req = urllib.request.Request(
                      f"{os.environ['COMMITS_URL']}?per_page=100&page={page}",
                      headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                               "Accept": "application/vnd.github+json"})
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      batch = json.load(resp)
                  out += [(c["sha"], c["commit"]["message"] or "") for c in batch]
                  if len(batch) < 100:
                      break
              return out

          if os.environ.get("EVENT") != "pull_request":
              print("Not a pull_request event: the PR head was already checked.")
              sys.exit(0)

          failed = False
          def report(level, title, msg):
              global failed
              failed = failed or level == "error"
              print(f"::{level} title={title}::{msg}")

          title = (os.environ.get("TITLE") or "").strip()
          body = os.environ.get("BODY") or ""
          branch = os.environ.get("BRANCH") or ""
          author = os.environ.get("AUTHOR") or ""
          bot = author.endswith("[bot]") and author.startswith(("dependabot", "renovate"))
          fork = os.environ.get("REPO_FORK") == "true"
          legacy = (os.environ.get("CREATED_AT") or "") < os.environ["ENFORCE_SINCE"]

          errs = header_errors(title)
          if errs:
              level = "warning" if bot or fork else "error"
              report(level, "PR title", f"'{title}': {'; '.join(errs)}. Expected e.g. "
                     f"'fix(auth): refuse expired sudo sessions'. Types: {TYPES.replace('|', ', ')}.")
          def check(level, title, what, text, tail=HELP):
              for checks, lvl in ((CHECKS, level), (ADDRESS_CHECKS, "warning" if bot or fork else level),
                                  (LOOPBACK_CHECKS, "warning")):
                  found = hits(text, checks)
                  if found:
                      report(lvl, title, f"{what} holds {', '.join(found)}. {tail}")

          for where, text in (("title", title), ("body", body)):
              check("error", f"Internal reference in the PR {where}", f"The PR {where}", text)
          branch_level = "warning" if legacy else "error"
          check(branch_level, "Internal reference in the branch name", f"Branch '{branch}'", branch,
                "Rename it with `gh api -X POST repos/<owner>/<repo>/branches/<old>/rename "
                f"-f new_name=<new>` (the PR follows). {HELP}")
          try:
              messages = commit_messages()
              count = int(os.environ.get("COMMIT_COUNT") or 0)
              if count > len(messages):  # fail closed past the API's 250-commit cap
                  report(branch_level, "Commit list", f"The PR has {count} commits but only "
                         f"{len(messages)} could be checked (the API stops at 250). Squash or split it.")
          except Exception as exc:  # fail closed; a re-run fixes a transient API error
              report("error", "Commit list", f"Could not list the PR commits: {exc}. Re-run the check.")
              messages = []
          for sha, message in messages:
              subject = message.splitlines()[0] if message else ""
              check(branch_level, "Internal reference in a commit message", f"{sha[:10]} '{subject}'",
                    message, f"Reword it at the next push. {HELP}")
          if failed:
              # The org ruleset does not re-run this check on a title or body edit.
              print("::notice title=Re-running this check::After fixing the title or body, "
                    "push a commit or close and reopen the PR; an edit alone does not re-run it.")
              sys.exit(1)
          print("PR standards OK")
          PYEOF
      - name: Check automated review findings are answered in format
        env:
          REVIEW_ENFORCE_SINCE: "2026-11-03T00:00:00Z"
          EVENT: ${{ github.event_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          CREATED_AT: ${{ github.event.pull_request.created_at }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ github.token }}
        run: |-
          python3 -I - <<'PYEOF2'
          import json, os, re, sys, urllib.request

          DEVIN = "devin-ai-integration"
          FORMATS = "`Fixed in <commit sha>`, `Rejected: <proof>` or `Duplicate of <link>`"
          # A rejection counts only with evidence on the first line (a link, an
          # issue ref, a file:line or a quoted name) or a full-sentence proof;
          # `Rejected: no` is not an answer.
          ANSWERED = (re.compile(r"^Fixed in [0-9a-fA-F]{7,40}(?![0-9a-fA-F])"),
                      re.compile(r"^Rejected:\s+.*(?:https?://\S+|#\d+\b|[\w./-]+\.\w+:\d+\b|`[^`]+`)"),
                      re.compile(r"^Rejected:\s+\S.{24,}"),
                      re.compile(r"^Duplicate of (?:https?://\S+\.\S+|#\d+\b|\[[^\]]*\]\(https?://[^)\s]+\))"))
          # first:100 carries the opening comment; last:20 keeps a fresh reply
          # visible on a thread long enough to overflow the first window.
          QUERY = """query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
            repository(owner: $owner, name: $repo) { pullRequest(number: $number) {
              reviewThreads(first: 100, after: $cursor) {
                pageInfo { hasNextPage endCursor }
                nodes { comments(first: 100) { nodes { author { login } body url } }
                        recentComments: comments(last: 20) { nodes { author { login } body url } } } } } } }"""

          def esc(text):
              return str(text).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def first_line(body):
              lines = (body or "").splitlines()
              return lines[0].strip() if lines else ""

          def fetch_threads():
              if "THREADS_JSON" in os.environ:  # self-tests
                  raw = os.environ["THREADS_JSON"]
                  if raw == "__error__":
                      raise RuntimeError("simulated thread-list failure")
                  return json.loads(raw)
              owner, repo = os.environ["REPO"].split("/", 1)
              threads, cursor = [], None
              for _ in range(5):  # at most 500 threads; fail closed past that
                  payload = {"query": QUERY, "variables": {"owner": owner, "repo": repo,
                             "number": int(os.environ["PR_NUMBER"]), "cursor": cursor}}
                  req = urllib.request.Request(
                      "https://api.github.com/graphql", data=json.dumps(payload).encode(),
                      headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                               "Accept": "application/vnd.github+json",
                               "Content-Type": "application/json",
                               "User-Agent": "pr-standards-review-replies"})
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = json.load(resp)
                  if data.get("errors"):
                      raise RuntimeError(data["errors"][0].get("message", "GraphQL error"))
                  conn = data["data"]["repository"]["pullRequest"]["reviewThreads"]
                  def tidy(nodes):
                      return [{"login": (c.get("author") or {}).get("login") or "",
                               "body": c.get("body") or "", "url": c.get("url") or ""}
                              for c in nodes]
                  for node in conn["nodes"]:
                      comments = tidy(node["comments"]["nodes"])
                      known = {c["url"] for c in comments}
                      comments += [c for c in tidy(node["recentComments"]["nodes"])
                                   if c["url"] not in known]
                      threads.append(comments)
                  if not conn["pageInfo"]["hasNextPage"]:
                      return threads
                  cursor = conn["pageInfo"]["endCursor"]
              raise RuntimeError("more than 500 review threads; cannot check them all")

          if os.environ.get("EVENT") != "pull_request":
              print("Not a pull_request event: the PR head was already checked.")
              sys.exit(0)

          author = os.environ.get("AUTHOR") or ""
          bot = author.endswith("[bot]") and author.startswith(("dependabot", "renovate"))
          legacy = (os.environ.get("CREATED_AT") or "") < os.environ["REVIEW_ENFORCE_SINCE"]
          draft = os.environ.get("DRAFT") == "true"
          fork_head = (os.environ.get("HEAD_REPO") or "") != (os.environ.get("REPO") or "")
          level = "warning" if (bot or legacy or draft or fork_head) else "error"

          try:
              threads = fetch_threads()
          except Exception as exc:  # fail closed at error level; a re-run fixes a transient API error
              print(f"::{level} title=Review replies::{esc(f'Could not list the review threads: {exc}.')} "
                    "Push a commit or close and reopen the PR to re-run this check.")
              sys.exit(1 if level == "error" else 0)

          devin_threads = [t for t in threads if t and (t[0].get("login") or "").lower() == DEVIN]
          unanswered = []
          for thread in devin_threads:
              replies = [c for c in thread[1:] if (c.get("login") or "").lower() != DEVIN]
              if any(pat.match(first_line(c.get("body"))) for c in replies for pat in ANSWERED):
                  continue
              # Never echo reply text into logs, annotations or the summary:
              # a reply can carry an internal identifier or other content
              # that does not belong in run output. The link is the pointer.
              if replies:
                  detail = "a reply exists, but no reply starts with a counted first line"
              else:
                  detail = "no reply yet (resolving the conversation does not count)"
              unanswered.append((thread[0].get("url") or "", detail))

          print(f"Devin review threads: {len(devin_threads)}; "
                f"answered in format: {len(devin_threads) - len(unanswered)}")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary and unanswered:
              try:
                  with open(summary, "a", encoding="utf-8") as fh:
                      fh.write("## Review findings still to answer\n\n"
                               f"Reply in each thread with a first line of exactly {FORMATS}:\n\n")
                      for url, detail in unanswered:
                          fh.write(f"- {url} - {detail}\n")
              except OSError:
                  pass
          for url, detail in unanswered:
              print(f"::{level} title=Unanswered review finding::{esc(url)}: {esc(detail)}. "
                    f"Reply in that thread with a first line of exactly {FORMATS} "
                    "(see TogetherWeOwn/.github CONTRIBUTING.md §4).")
          if unanswered:
              print("::notice title=Re-running this check::Replies are read when this check runs. "
                    "Post the replies, then push a commit or close and reopen the PR to re-run it. "
                    "Fastest path next round: commit the fixes, post the replies citing that "
                    "commit, then push once.")
              sys.exit(1 if level == "error" else 0)
          print("Review replies OK")
          PYEOF2
      - name: Check pilot PR contract and added test lines
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          DRAFT: ${{ github.event.pull_request.draft }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |-
          python3 -I - <<'PILOT_PY'
          import ast, json, os, re, sys, urllib.request

          # Explicit pilot only. Widening this set needs a separately reviewed rollout.
          PILOTS = {"TogetherWeOwn/paperclip-plugin-sandbox-boat"}
          SECTIONS = ("Testing", "Risk", "How to revert", "What these checks would miss")
          bot = re.fullmatch(r"(?:dependabot|renovate)(?:\[bot\]|-bot)?", os.environ.get("AUTHOR", ""))
          strict = (os.environ.get("REPO") in PILOTS and not bot
                    and os.environ.get("DRAFT") != "true"
                    and os.environ.get("HEAD_REPO") == os.environ.get("REPO"))
          level = "error" if strict else "warning"
          failed = False
          notes = []

          def esc(value, prop=False):
              text = str(value).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              return text.replace(":", "%3A").replace(",", "%2C") if prop else text

          def report(title, message, path=None, line=None, advisory=False):
              global failed
              severity = "warning" if advisory else level
              failed |= severity == "error"
              props = f"title={esc(title, True)}"
              if path:
                  props += f",file={esc(path, True)}"
              if line:
                  props += f",line={line}"
              print(f"::{severity} {props}::{esc(message)}")
              # Fixed diagnostic text only; never reproduce PR body or test source.
              notes.append(f"- {severity}: {title}: {message}")

          def contract(body):
              text = re.sub(r"<!--[\s\S]*?(?:-->|$)", "", body)
              sections, current, fence = {}, None, None
              for line in text.splitlines():
                  marker = re.match(r"^\s*(`{3,}|~{3,})(.*)$", line)
                  if fence:
                      if marker and marker[1][0] == fence[0] and len(marker[1]) >= len(fence) and not marker[2].strip():
                          fence = None
                      elif current and not re.match(r"^\s*#{1,6}\s", line):
                          sections[current].append(line)
                      continue
                  if marker:
                      fence = marker[1]
                      continue
                  heading = re.match(r"^##\s+(.+?)\s*#*\s*$", line)
                  if heading:
                      current = heading[1].casefold()
                      sections.setdefault(current, [])
                  elif re.match(r"^#\s", line):
                      current = None
                  elif current and not re.match(r"^\s*#{1,6}\s", line):
                      sections[current].append(line)
              for name in SECTIONS:
                  value = "\n".join(sections.get(name.casefold(), []))
                  value = re.sub(r"<[^>]*>", "", value)
                  value = re.sub(r"(?m)^\s*(?:[-*+]\s*|\[[ xX]\]\s*)", "", value).strip()
                  # N/A is an exemption only when its reason is substantive too.
                  value = re.sub(r"^[\W_]+|[\W_]+$", "", value)
                  value = re.sub(r"(?i)^n/?a\b\s*[-—–:]?\s*", "", value)
                  value = re.sub(r"^[\W_]+|[\W_]+$", "", value)
                  placeholder = re.fullmatch(r"(?i)(?:n/?a|none|todo|tbd|reason|testing|risk|how to revert|what these checks would miss)", value)
                  if not value or placeholder:
                      report("PR contract", f"Section '## {name}' is missing, empty or a placeholder. Use evidence or N/A — a concrete reason.")

          def api(suffix):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPO']}/pulls/{os.environ['PR_NUMBER']}{suffix}",
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                           "Accept": "application/vnd.github+json", "User-Agent": "pr-standards-pilot"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          def files():
              if "FILES_JSON" in os.environ:  # offline fixtures only, not workflow input
                  return json.loads(os.environ["FILES_JSON"])
              before = api("")
              if before["head"]["sha"] != os.environ["HEAD_SHA"]:
                  raise ValueError("PR head changed; re-run at its current head")
              result = []
              for page in range(1, 31):  # GitHub's 3000-file API limit
                  batch = api(f"/files?per_page=100&page={page}")
                  result.extend(batch)
                  if len(batch) < 100:
                      break
              after = api("")
              if (after["head"]["sha"] != before["head"]["sha"]
                      or after["base"]["sha"] != before["base"]["sha"]
                      or len(result) != after["changed_files"]):
                  raise ValueError("PR diff changed or file listing is incomplete; re-run or split the PR")
              return result

          def test_file(path):
              name = path.rsplit("/", 1)[-1]
              if not re.search(r"\.(?:[cm]?[jt]sx?|py|go|rs)$", name):
                  return False
              # Rust unit tests live inline in ordinary .rs source modules.
              return bool(path.endswith(".rs") or re.search(r"(?:^|/)(?:__tests__|tests?|specs?)/", path)
                          or re.search(r"(?:^test_.*\.py$|_test\.(?:py|go)$|\.(?:test|spec)\.[cm]?[jt]sx?$)", name))

          def hunks(patch):
              new, rows = 0, []
              for raw in patch.splitlines():
                  hunk = re.match(r"^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@", raw)
                  if hunk:
                      if rows:
                          yield rows
                      new, rows = int(hunk[1]), []
                  elif raw.startswith(("+", " ")):
                      rows.append((new, raw[1:], raw.startswith("+")))
                      new += 1
                  # Removed lines are not part of the new file's lexical context.
              if rows:
                  yield rows

          def string(value, python=False):
              # Only safe static text literals count, never f-strings or bytes.
              prefix = r"(?i:[ru])?" if python else ""
              match = re.match(r"\s*(" + prefix + r'''(?:"{3}[\s\S]*?"{3}|'{3}[\s\S]*?'{3}|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'))''', value)
              if not match:
                  return False
              try:
                  literal = ast.literal_eval(match[1])
                  return isinstance(literal, str) and bool(literal.strip())
              except (ValueError, SyntaxError):
                  return False

          def syntax(text, language):
              # Lex each visible new-file hunk once, preserving offsets/newlines.
              mask = list(text)
              comments = ["\n" if c == "\n" else " " for c in text]
              i = 0
              while i < len(text):
                  start = i
                  # A Rust lifetime is not the start of a quoted character.
                  lifetime = language == "rs" and text[i] == "'" and not re.match(r"'(?:\\.|[^'\\\n])'", text[i:])
                  if text[i] in "\"'`" and not lifetime:
                      quote = text[i]
                      if language == "py" and text.startswith(quote * 3, i):
                          quote *= 3
                      i += len(quote)
                      while i < len(text):
                          if text[i] == "\\":
                              i = min(i + 2, len(text))
                          elif text.startswith(quote, i):
                              i += len(quote)
                              break
                          else:
                              i += 1
                  elif ((language == "py" and text[i] == "#")
                        or (language != "py" and text.startswith(("//", "/*"), i))):
                      if text.startswith("/*", i):
                          end = text.find("*/", i + 2)
                          i = len(text) if end < 0 else end + 2
                      else:
                          end = text.find("\n", i)
                          i = len(text) if end < 0 else end
                      comments[start:i] = text[start:i]
                  else:
                      i += 1
                      continue
                  mask[start:i] = ["\n" if c == "\n" else " " for c in text[start:i]]
              return "".join(mask), "".join(comments)

          def comment_reason(comments):
              return bool(re.search(r"(?://|#|/\*)\s*skip-reason:\s*[^\s*/].*", comments, re.I))

          def skip_problem(text, code, comments, previous_comments, language):
              first_code = code.split("\n", 1)[0]
              registration = r"(?<![\w$.])(?:it|test|describe)(?:\s*\.\s*(?:concurrent|sequential|serial|describe))*"
              # Focus is never justified, including chained/tagged registrations.
              if language == "js" and re.search(registration + r"\s*\.\s*only\b", first_code):
                  return "Focused .only test suppresses the rest of the suite. Remove it."
              reason = comment_reason(comments) or comment_reason(previous_comments)
              js = language == "js" and re.search(registration + r"\s*\.\s*skip\b|\b(?:xit|xdescribe)\s*\(", first_code)
              py_mark = language == "py" and re.search(r"@pytest\.mark\.skip(?:if)?\b", first_code)
              py_call = language == "py" and re.search(r"\bpytest\.skip\s*\(", first_code)
              rust = language == "rs" and re.search(r"#\s*\[\s*ignore\b", first_code)
              go = language == "go" and re.search(r"\bt\.Skip\s*\(", first_code)
              # A JS test's name is not a skip reason. As in the T3 matcher,
              # justification belongs in a comment adjacent to registration.
              if js and not reason:
                  return "JS test skip needs an adjacent skip-reason comment (the test name is not a reason)."
              if py_mark:
                  argument = re.search(r"\breason\s*=", code[py_mark.end():])
                  if not (reason or (argument and string(text[py_mark.end() + argument.end():], python=True))):
                      return "pytest skip/skipif needs a non-empty reason= or skip-reason comment."
              if py_call:
                  argument = re.match(r"\s*reason\s*=", code[py_call.end():])
                  start = py_call.end() + (argument.end() if argument else 0)
                  if not (reason or string(text[start:], python=True)):
                      return "pytest.skip needs a non-empty message or skip-reason comment."
              if rust:
                  argument = re.match(r"\s*=", code[rust.end():])
                  if not (reason or (argument and string(text[rust.end() + argument.end():]))):
                      return 'Rust ignore needs = "reason" or a skip-reason comment.'
              if go and not (reason or string(text[go.end():])):
                  return "t.Skip needs a non-empty message or skip-reason comment."
              return None

          def scan(changed):
              for file in changed:
                  path = file["filename"]
                  test = test_file(path) or test_file(file.get("previous_filename", ""))
                  if file.get("status") == "removed":
                      if test:
                          report("Deleted tests (advisory)", "A test file was deleted; review lost coverage.", path, advisory=True)
                      continue
                  patch = file.get("patch")
                  if patch is None:
                      if test and file.get("changes", 0):
                          report("Test diff unavailable", "Cannot inspect added test lines; split this diff or supply a text test file.", path)
                      continue
                  if test and any(re.search(r"^-.*\b(?:it|test|describe|def test_|fn |func Test)", line)
                                  for line in patch.splitlines()):
                      report("Deleted tests (advisory)", "Test cases may have been deleted or replaced; review lost coverage.", path, advisory=True)
                  # Changed numeric coverage settings are advisory, never a gate.
                  removed = [float(n) for line in patch.splitlines() if line.startswith("-")
                             and re.search(r"coverage|threshold|branches|functions|lines|statements", line, re.I)
                             for n in re.findall(r"\b\d+(?:\.\d+)?\b", line)]
                  added = [float(n) for line in patch.splitlines() if line.startswith("+")
                           and re.search(r"coverage|threshold|branches|functions|lines|statements", line, re.I)
                           for n in re.findall(r"\b\d+(?:\.\d+)?\b", line)]
                  if removed and added and min(added) < max(removed):
                      report("Coverage setting lowered (advisory)", "A numeric coverage/threshold setting may have decreased; inspect the diff.", path, advisory=True)
                  if test:
                      extension = path.rsplit(".", 1)[-1]
                      language = extension if extension in ("py", "go", "rs") else "js"
                      for rows in hunks(patch):
                          source = "\n".join(text for _, text, _ in rows)
                          code, comments = syntax(source, language)
                          code_lines, comment_lines = code.split("\n"), comments.split("\n")
                          for index, (number, text, added_line) in enumerate(rows):
                              if not added_line:
                                  continue
                              # Only markers on added lines count; arguments may
                              # continue over at most 20 following visible lines.
                              end = index + 1
                              depth = 0
                              for offset in range(index, min(index + 21, len(rows))):
                                  part = code_lines[offset]
                                  depth += sum(part.count(c) for c in "([") - sum(part.count(c) for c in ")]")
                                  end = offset + 1
                                  if depth <= 0:
                                      break
                              text = "\n".join(row[1] for row in rows[index:end])
                              code = "\n".join(code_lines[index:end])
                              previous_comments = comment_lines[index - 1] if index else ""
                              problem = skip_problem(text, code, comment_lines[index], previous_comments, language)
                              if problem:
                                  report("Test skip lint", problem, path, number)

          if os.environ.get("EVENT") != "pull_request":
              print("Not a pull_request event: the PR head was already checked.")
              sys.exit(0)
          contract(os.environ.get("BODY", ""))
          try:
              scan(files())
          except Exception:
              report("PR diff unavailable", "Cannot inspect the complete exact-head PR diff; re-run the check or split the PR.")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  # Diagnostic text only; paths and source stay out of Markdown.
                  fh.write("## PR contract / test-skip pilot\n\n"
                           + ("Enforced pilot.\n\n" if strict else "Warning-only context.\n\n")
                           + "\n".join(notes) + "\n")
          sys.exit(1 if failed else 0)
          PILOT_PY
