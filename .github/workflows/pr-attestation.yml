# Shadow instrument only. No enforce input or repo-controlled policy override.
# Target PR content is read via API; NEVER check out or execute a target PR.
# Pin updates: commit the validator first, then update the checkout ref below;
# commit this reusable, then repin pr-attestation-required.yml to that commit.
# After squash merge, repin to reachable main commits before branch cleanup.
name: PR attestation (reusable, shadow)

on:
  workflow_call:
    inputs:
      runs-on-json:
        description: 'Runner labels; private callers use their existing self-hosted pool.'
        required: false
        type: string
        default: '["ubuntu-latest"]'
    outputs:
      verdict:
        description: 'valid|invalid|error observation; never an enforcement decision.'
        value: ${{ jobs.observe.outputs.verdict }}
      would_fail:
        description: 'true for invalid/incomplete observations; useful for shadow measurement.'
        value: ${{ jobs.observe.outputs.would_fail }}

permissions:
  contents: read
  pull-requests: read

jobs:
  observe:
    name: observe
    runs-on: ${{ fromJSON(inputs.runs-on-json) }}
    timeout-minutes: 5
    # Even infrastructure failures remain non-blocking while collecting data.
    continue-on-error: true
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
      would_fail: ${{ steps.check.outputs.would_fail }}
    steps:
      - name: Checkout trusted policy only
        id: policy
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: TogetherWeOwn/.github
          ref: 089413484cabf43bb675d22ab84098ecf46fcc04
          path: attestation-policy
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Observe attestation from the pulls API
        id: check
        if: steps.policy.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I "$GITHUB_WORKSPACE/attestation-policy/.github/scripts/pr_attestation.py"
      - name: Report an unavailable observation without failing
        if: always() && steps.check.outputs.verdict == ''
        run: |
          printf '%s\n' '::warning::PR attestation shadow observation unavailable; not a clean verdict.'
          printf '%s\n' '## PR attestation (shadow / WARN)' '' 'Observation: **error** (runner, checkout or validator unavailable). No enforcement.' >> "$GITHUB_STEP_SUMMARY"
