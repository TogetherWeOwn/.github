rules:
- id: rust-err-arm-without-metric
  languages:
  - rust
  message: 'RUST-01: Err arm has no local metric signal; confirm an exemption or increment and a killing
    test.'
  severity: WARNING
  metadata:
    examples:
    - two-bot-next#712 clear-failure-uncounted
    - two-bot-next#978 purge-skip-error-line-unpinned-uncounted
    confidence: LOW
    mode: shadow
    category: correctness
    proof: Advisory static signal; confirm with the named behavioral test before promotion.
  patterns:
  - pattern-regex: (?s)Err\([^)]*\)\s*=>\s*\{[^{}]{0,600}\}
  - pattern-not-regex: counter!|gauge!|histogram!|metrics::|increment|observe
