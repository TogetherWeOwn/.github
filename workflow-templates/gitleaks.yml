name: gitleaks

# TogetherWeOwn pipeline standard: full-history secret scan, required check `gitleaks` on the default branch.
# Uses the gitleaks binary via its official image (the gitleaks-action wrapper needs a paid licence for orgs).
# Pin the image by digest when adopting. Also triggers on merge_group so the merge queue sees the required check.

on:
  pull_request:
  merge_group:
  push:
    branches: [ $default-branch ]

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source /repo --redact --exit-code 1
