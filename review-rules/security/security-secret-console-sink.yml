rules:
- id: security-secret-console-sink
  languages:
  - typescript
  - javascript
  message: 'SEC-AUTH-03B: raw credential-named value reaches console; prove redaction before this sink.'
  severity: ERROR
  metadata:
    examples:
    - paperclip#49 secret-denylist-missing-xai-bedrock
    confidence: LOW
    mode: shadow
    category: correctness
    proof: Advisory static signal; confirm with the named behavioral test before promotion.
  patterns:
  - pattern-either:
    - pattern: console.log($S)
    - pattern: console.error($S)
    - pattern: console.debug($S)
  - metavariable-regex:
      metavariable: $S
      regex: (?i)^(password|secret|apiKey|api_key|accessToken|refreshToken|credentials)$
