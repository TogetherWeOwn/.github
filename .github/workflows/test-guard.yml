# Reusable SDLC separation gate: the Builder must not modify acceptance
# tests written by the Test Author (SDLC factory design, section (c)).
#
# Evidence: AgentCoder — a separate test designer gains a lot (HumanEval
# 79.9% vs 71.3%, test accuracy 87.8% vs 61.0%). Enforcement here is a
# deterministic permission boundary (git trailer + CI gate), NOT a new
# session: a fresh session without a permission split is theatre.
#
# Lives in the org `.github` repo at `.github/workflows/test-guard.yml`.
# Callers reference a pinned SHA:
#   uses: TogetherWeOwn/.github/.github/workflows/test-guard.yml@<sha>
#
# What it does (stdlib python under `python3 -I` + git diff only,
# ~30s on ubuntu-latest; -I so a PR-planted root module cannot shadow
# the stdlib):
#   * diffs the PR against its merge base, matches changed files against
#     the test globs with fnmatch on the full posix path (defaults cover
#     **/*.test.*, **/*.spec.*, **/__tests__/**, tests/**, test/**,
#     *_test.go, **/tests/*.rs; per-repo overrides in
#     `.github/test-guard.json`). fnmatch, not PurePath.match: the
#     latter treats ** as one component and misses nested files;
#   * classifies every commit touching test files by its LAST
#     `Paperclip-Agent: <agent-id>` trailer (the host commit-msg hook
#     appends — and overwrites pre-existing — trailers from the run env,
#     so the last line is the hook's; an id in `test-author-ids` proves
#     the Test Author wrote it, with a legacy co-author fallback for
#     pre-hook history). Trailers are advisory: a deliberately typed
#     trailer (e.g. `git commit --no-verify`) passes the gate with no run-
#     env tampering at all, so the hook (platform-set env, overwrite
#     semantics, audit log) is friction, not a forgery boundary. The gate
#     catches role mix-ups — the wrong agent editing tests — not
#     determined forgery, which is a conduct/audit matter;
#   * passes when no test files are touched, when every test-touching
#     commit is test-author-attributed, or — for untrailered (pre-hook)
#     history only — when the marker label (default
#     `tests-by-test-author`, set by the Test Author/QA flow) is proven:
#     present AND applied by someone other than the PR author (actor from
#     the issue-events API, so the Builder cannot self-label; labels are
#     refreshed from the pulls API each run since re-runs keep a stale
#     event, and the merge_group base comes from the API too). An explicit
#     Builder trailer fails the gate even when the label is present (the
#     label excuses unknown provenance, never a known Builder hand), and
#     an unprovable-but-needed label is an error, never a silent pass. A
#     label that is not needed (commits already prove ownership) is
#     ignored, so a self-applied label cannot poison a clean PR;
#   * otherwise warns (mode `warn`, the default) or fails (mode `enforce`).
#
# Rollout: warn mode org-wide first. Add the caller as a NON-required
# check (required-check renames strand open PRs). Flip to enforce per repo
# only after the Test Author flow is live and ~20 PRs show no false
# positives: set `"mode": "enforce"` in that repo's
# `.github/test-guard.json`. Do NOT flip the default here until then.
# The `would_fail` output lets you count would-be failures while in warn.
#
# Attribution contract (agents were NOT distinguishable in commits: Oct
# 2026 commits are all author=committer=Rick7C2 with one generic
# `Co-Authored-By: Paperclip <noreply@paperclip.ing>` trailer; per-role
# `Co-authored-by: <Role> (Paperclip agent)` trailers seen Sep 2026 had
# regressed away). Fixed at ONE host-side choke point (owner decision
# 2026-10-12, no per-agent config): the host commit-msg hook at
# core.hooksPath appends `Paperclip-Agent: <agent-id>` and
# `Paperclip-Run: <run-id>` to every agent commit and OVERWRITES any
# pre-existing Paperclip-Agent/Run trailer lines with the run-env values
# (both ids come from PAPERCLIP_AGENT_ID / PAPERCLIP_RUN_ID; idempotent
# when identical, fail-open, never invokes git, so it is clear of the
# per-run shim recursion trap). The gate reads the LAST trailer line,
# which post-hook is always the hook's — a forged earlier line loses.
# Test Author id: 2c980cec-9df5-40a3-80c5-00b3b9448fbb; if the Test Author
# agent is ever replaced, update `test-author-ids` (input or repo config),
# not this file. Commits before the hook carry no trailer and count as
# builder-touched, so the gate MUST stay in warn mode until ~20 PRs carry
# correct trailers with no false positives.
#
# Inputs are JSON strings where they carry structure, mirroring
# changes.yml. A repo-local `.github/test-guard.json` overrides the
# inputs when present: {"testGlobs": [...], "mode": "warn"|"enforce",
# "markerLabel": "...",
# "testAuthorIds": ["2c980cec-9df5-40a3-80c5-00b3b9448fbb"]}.
# Trust (read carefully — this overstates nothing):
#   * the config is read from the BASE ref at the HARD-CODED path
#     .github/test-guard.json (no config-path input to retarget), so a
#     PR cannot neuter its gate via the config file. A PR that touches
#     the config path is judged by the base policy and flagged;
#   * BUT on pull_request events the caller workflow comes from the PR
#     itself, so a PR-edited caller (mode/test-globs inputs) can still
#     weaken its own run. Enforce is therefore trustworthy ONLY when the
#     gate runs as an org-ruleset required workflow (sourced from this
#     repo at a pinned ref) or when the caller + config are
#     CODEOWNERS-protected. Step 4 of the rollout requires the WORKFLOW,
#     not just the check name. Until then: warn mode, no security claim.
# Outputs: `verdict` is clean|attributed|builder-touched|error;
# `would_fail` is 'true' when enforce mode would fail this PR.

name: test-guard (reusable)

on:
  workflow_call:
    inputs:
      mode:
        description: '"warn" (default, never fails) or "enforce". Repo config file wins when present.'
        required: false
        default: "warn"
        type: string
      test-globs-json:
        description: 'JSON array of globs for test files. Repo config file wins when present.'
        required: false
        default: '["**/*.test.*", "**/*.spec.*", "**/__tests__/**", "tests/**", "**/tests/**", "test/**", "**/test/**", "*_test.go", "**/tests/*.rs"]'
        type: string
      marker-label:
        description: "PR label proving Test Author ownership. Repo config file wins when present."
        required: false
        default: "tests-by-test-author"
        type: string
      test-author-ids:
        description: 'Comma-separated Paperclip agent-UUIDs that prove Test Author ownership (primary key: the Paperclip-Agent trailer carries the agent id, appended by the host commit-msg hook). Repo config file wins when present.'
        required: false
        default: "2c980cec-9df5-40a3-80c5-00b3b9448fbb"
        type: string
    outputs:
      verdict:
        description: "clean|attributed|builder-touched|error"
        value: ${{ jobs.gate.outputs.verdict }}
      would_fail:
        description: "'true' when enforce mode would fail this PR."
        value: ${{ jobs.gate.outputs.would_fail }}
      test_files:
        description: "JSON array of changed test files."
        value: ${{ jobs.gate.outputs.test_files }}

jobs:
  gate:
    # Display name inside reusable-call checks ("<caller> / gate").
    # The bare `test-guard` required check comes from the aggregator in
    # test-guard-required.yml; keep THAT id+name byte-identical instead.
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
      would_fail: ${{ steps.check.outputs.would_fail }}
      test_files: ${{ steps.check.outputs.test_files }}
    steps:
      # Pinned: actions/checkout v4.2.2. Repin with the SHA, never a moving tag.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # `python3 -I -`: isolated mode. The step runs on the PR checkout,
      # so without -I a PR could plant a root-level `fnmatch.py` (or set
      # PYTHONPATH) and shadow the stdlib the gate imports, turning an
      # enforce failure into `clean`. -I drops the cwd/script-dir from
      # sys.path and ignores PYTHON* / user site; the script needs only
      # stdlib + env + absolute paths, so nothing else changes.
      - name: Check test-file ownership
        id: check
        env:
          MODE: ${{ inputs.mode }}
          TEST_GLOBS_JSON: ${{ inputs.test-globs-json }}
          MARKER_LABEL: ${{ inputs.marker-label }}
          TEST_AUTHOR_IDS: ${{ inputs.test-author-ids }}
          EVENT_BASE: ${{ github.base_ref }}
          # For the marker-label actor audit (gh issue-events API).
          # Callers must grant pull-requests: read (see template).
          GH_TOKEN: ${{ github.token }}
        run: |-
          python3 -I - <<'PYEOF'
          import fnmatch, json, os, re, subprocess, sys

          def sh(*args):
              # Return-code-checked git: callers must handle rc != 0.
              # A silent empty string here once reported clean on git
              # failure, so every git call below checks rc explicitly.
              p = subprocess.run(args, capture_output=True, text=True)
              return p.returncode, p.stdout.strip()

          def out(name, value):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"{name}={value}\n")

          def summary(lines):
              with open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a") as f:
                  f.write("\n".join(lines) + "\n")

          def esc(s):
              # Workflow-command escaping for anything printed to the
              # log: a test path containing a newline could otherwise
              # inject ::error::/::warning::/::add-mask:: lines. Verdict
              # and exit code never come from printed text, but forged
              # annotations would still mislead.
              return str(s).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def finish(verdict, would_fail, test_files, note):
              out("verdict", verdict)
              out("would_fail", "true" if would_fail else "false")
              out("test_files", json.dumps(sorted(test_files)))
              summary([
                  "## test-guard",
                  f"- verdict: `{verdict}`",
                  f"- would_fail (enforce): `{str(would_fail).lower()}`",
                  f"- test files touched: `{len(test_files)}`",
                  f"- note: {esc(note)}",
              ])
              for t in sorted(test_files)[:20]:
                  summary([f"  - `{esc(t)}`"])

          def done(verdict, would_fail, test_files, note, mode):
              # Single exit funnel: warn mode NEVER fails the step
              # (exit 0); enforce mode fails closed on builder-touched
              # AND on internal errors (exit 1). Nothing falls through
              # to an unguarded traceback.
              if verdict == "error" or (would_fail and mode == "enforce"):
                  tag = "::error::" if mode == "enforce" else "::warning::"
                  print(f"{tag}test-guard: {esc(note)}")
                  finish(verdict, would_fail, test_files, note)
                  sys.exit(1 if mode == "enforce" else 0)
              if would_fail:
                  print(f"::warning::test-guard: [warn-only] {esc(note)}")
              finish(verdict, would_fail, test_files, note)
              sys.exit(0)

          try:
              mode = os.environ.get("MODE", "warn").strip().lower()
              if mode not in ("warn", "enforce"):
                  raise ValueError(f"bad mode {mode!r}; want warn|enforce")
              try:
                  globs = json.loads(os.environ.get("TEST_GLOBS_JSON", "[]"))
              except Exception as e:
                  raise ValueError(f"bad test-globs-json: {e}")
              if not isinstance(globs, list) or not all(isinstance(g, str) for g in globs):
                  raise ValueError("bad test-globs-json: want a JSON array of strings")
              marker = os.environ.get("MARKER_LABEL", "tests-by-test-author").strip().lower()
              ids = [t.strip().lower() for t in os.environ.get("TEST_AUTHOR_IDS", "").split(",") if t.strip()]

              # Hard-coded: no config-path input to retarget (a PR-edited
              # caller must not be able to point the gate at /dev/null).
              cfg_path = ".github/test-guard.json"
              # base_ref + base config resolve AFTER the PR lookup below:
              # on merge_group events github.base_ref is empty and the
              # true base comes from the pulls API (master-default repos
              # would otherwise error against a nonexistent origin/main).

              def is_test(path):
                  # fnmatch on the full posix path (fnmatch '*' crosses
                  # '/'; PurePath.match does NOT — it treats ** as one
                  # component and right-aligns, missing nested files).
                  # Also try each glob with one leading '**/' removed so
                  # root-level files match '**/...' patterns.
                  for g in globs:
                      if fnmatch.fnmatchcase(path, g):
                          return True
                      if g.startswith("**/") and fnmatch.fnmatchcase(path, g[3:]):
                          return True
                  return False

              # PR labels excuse untrailered (pre-hook) test history ONLY
              # when applied by someone other than the PR author (the Test
              # Author/QA flow, not the Builder self-labeling its own PR).
              # The actor comes from the issue-events API, not the payload,
              # so a PR-edited caller cannot forge it. Labels themselves
              # come from the pull_request payload, or — on merge_group
              # events, whose payload carries no PR — from the pulls API
              # (commit -> PR -> labels), since a label-authorized PR must
              # survive the merge-queue re-run in enforce mode.
              def gh_paged(path):
                  # Paginated GET returning every top-level value across
                  # all pages. No --jq: `gh api --paginate --jq '[.[]]'`
                  # prints one JSON array PER page, which is unparseable
                  # as a whole past page one (>30 issue events). Raw
                  # bodies are split with raw_decode instead.
                  rc, raw = sh("gh", "api", path, "--paginate")
                  if rc != 0:
                      return False, []
                  vals = []
                  try:
                      dec = json.JSONDecoder()
                      i, n = 0, len(raw)
                      while i < n:
                          while i < n and raw[i].isspace():
                              i += 1
                          if i >= n:
                              break
                          obj, j = dec.raw_decode(raw, i)
                          vals.append(obj)
                          i = j
                  except Exception:
                      return False, []
                  flat = []
                  for v in vals:
                      if isinstance(v, list):
                          flat.extend(v)
                      elif isinstance(v, dict):
                          flat.append(v)
                  return True, flat

              labels = []
              pr_number = None
              pr_author = ""
              api_base = ""
              label_src = "event payload"
              repo_full = os.environ.get("GITHUB_REPOSITORY", "")
              has_token = bool(os.environ.get("GH_TOKEN"))
              try:
                  event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
                  pr = event.get("pull_request") or {}
                  labels = [(l.get("name") or "").lower() for l in (pr.get("labels") or [])]
                  pr_number = pr.get("number")
                  pr_author = ((pr.get("user") or {}).get("login") or "").lower()
                  repo_full = ((event.get("repository") or {}).get("full_name") or repo_full)
                  mg = event.get("merge_group") or {}
                  mg_sha = mg.get("head_sha") or ""
                  if pr_number is None and mg_sha and repo_full and has_token:
                      # merge_group: resolve the PR behind the queue head
                      # (best-effort; the merge queue is off as of 2026-10,
                      # so this path is unexercised live and fails closed
                      # below when the label is actually needed).
                      ok, pulls = gh_paged(f"repos/{repo_full}/commits/{mg_sha}/pulls?per_page=100")
                      pr0 = (pulls or [{}])[0]
                      if ok and pr0.get("number"):
                          pr_number = pr0.get("number")
                          pr_author = ((pr0.get("user") or {}).get("login") or "").lower()
                      else:
                          print("::warning::test-guard: merge_group PR resolution failed; label path unavailable")
                  if pr_number and repo_full and has_token:
                      # Fresh labels + base from the API, not the payload:
                      # a re-run keeps its original event, so payload labels
                      # go stale and a late label would need a new push.
                      # Payload stays as the fallback when the API fails.
                      ok2, prdoc = gh_paged(f"repos/{repo_full}/pulls/{pr_number}")
                      if ok2 and prdoc and isinstance(prdoc[0], dict):
                          labels = [(l.get("name") or "").lower()
                                    for l in ((prdoc[0] or {}).get("labels") or [])]
                          api_base = str((((prdoc[0] or {}).get("base") or {}).get("ref")) or "")
                          label_src = "pulls API"
              except Exception as e:
                  print(f"::warning::test-guard: could not read event labels: {e}")

              base_ref = os.environ.get("EVENT_BASE") or api_base or "main"

              # Config trust: the PR under test must not control its own
              # gate policy, so the config is read from the BASE ref, not
              # the PR working tree. A PR that adds or edits the config is
              # judged by the base policy; the change takes effect for
              # LATER PRs (so the flip-to-enforce PR itself still passes).
              cfg_src = "inputs"
              rc, cfg_text = sh("git", "show", f"origin/{base_ref}:{cfg_path}")
              if rc == 0:
                  try:
                      cfg = json.loads(cfg_text)
                      for k in (cfg or {}):
                          if k not in ("testGlobs", "mode", "markerLabel", "testAuthorIds"):
                              print(f"::warning::test-guard: ignoring unknown config key {k!r}")
                      if isinstance(cfg.get("testGlobs"), list) and cfg["testGlobs"]:
                          globs = [str(g) for g in cfg["testGlobs"] if str(g)]
                      if str(cfg.get("mode", "")).lower() in ("warn", "enforce"):
                          mode = str(cfg["mode"]).lower()
                      if str(cfg.get("markerLabel", "")).strip():
                          marker = str(cfg["markerLabel"]).strip().lower()
                      if isinstance(cfg.get("testAuthorIds"), list) and cfg["testAuthorIds"]:
                          ids = [str(t).strip().lower() for t in cfg["testAuthorIds"] if str(t).strip()]
                      cfg_src = f"origin/{base_ref}:{cfg_path}"
                  except Exception as e:
                      print(f"::warning::test-guard: ignoring unreadable base config: {e}")

              def marker_actor():
                  # Latest actor to apply the marker label, or (None,
                  # reason) when it cannot be proven. Any API/parse
                  # failure is an error, never a silent pass — but only
                  # callers that NEED the label consult this.
                  if marker not in labels:
                      return None, "marker label absent"
                  if not pr_number or not repo_full:
                      return None, "no PR number/repo for label audit"
                  if not has_token:
                      return None, "no GH_TOKEN for label audit"
                  ok, events = gh_paged(f"repos/{repo_full}/issues/{pr_number}/events?per_page=100")
                  if not ok:
                      return None, "label events API failed"
                  applied = [e for e in events
                             if isinstance(e, dict) and e.get("event") == "labeled"
                             and str((((e.get("label") or {}).get("name")) or "")).lower() == marker]
                  if not applied:
                      return None, "no labeled event for marker"
                  actor = str((((applied[-1].get("actor") or {}).get("login")) or "").lower())
                  if not actor:
                      return None, "label actor unknown"
                  if pr_author and actor == pr_author:
                      return None, f"marker applied by PR author ({actor})"
                  return actor, "ok"

              rc, base = sh("git", "merge-base", "HEAD", f"origin/{base_ref}")
              if rc != 0 or not base:
                  rc, base = sh("git", "rev-parse", f"origin/{base_ref}")
              if rc != 0 or not base:
                  done("error", True, set(), "no base ref available", mode)

              # -z throughout: NUL-separated raw paths. Default quotepath
              # renders non-ASCII paths as "quoted octal" (tests/caf\E9..),
              # which evades anchored globs; -z emits them raw.
              rc, diff_out = sh("git", "-c", "core.quotepath=false", "diff", "--name-only", "-z", "--no-renames", f"{base}...HEAD")
              if rc != 0:
                  done("error", True, set(), "git diff failed; refusing to report clean", mode)
              files = [f for f in diff_out.split("\0") if f]
              # A PR that edits the gate config is judged by the base
              # policy above; flag it so reviewers look twice.
              config_touched = cfg_path in files
              test_files = {f for f in files if is_test(f)}
              if not test_files and not config_touched:
                  done("clean", False, set(), f"no test files touched (globs from {cfg_src})", mode)

              trailer_re = re.compile(r"^paperclip-agent:\s*(.+?)\s*$", re.IGNORECASE | re.MULTILINE)
              # Legacy fallback: Sep-2026 style per-role co-authors, e.g.
              # "Co-authored-by: QA & Release Engineer (Paperclip agent)
              # <qa@paperclip.local>". Match whole role tokens only —
              # a raw 'test' substring overmatches ('greatest', 'latest').
              legacy_marker = re.compile(r"\(paperclip agent\)", re.IGNORECASE)
              legacy_role = re.compile(r"(?:^|[\s\-_/])(test-author|test author|testauthor|\bqa\b)(?:$|[\s\-_/])", re.IGNORECASE)

              def classify(message):
                  # Three states: "ta" (Test Author trailer, or legacy
                  # QA co-author on trailer-less pre-hook history),
                  # "builder" (an explicit Paperclip-Agent trailer that is
                  # NOT the Test Author — a known Builder hand), or
                  # "unknown" (no trailer at all). LAST trailer wins: the
                  # host hook overwrites/appends from the run env, so the
                  # last Paperclip-Agent line is the hook's. (A lone forged
                  # line still reads "ta" — trailers are advisory; the gate
                  # catches role mix-ups, not determined forgery.)
                  hits = trailer_re.findall(message or "")
                  if hits:
                      return "ta" if hits[-1].lower() in ids else "builder"
                  # Legacy fallback ONLY when the commit carries no
                  # Paperclip-Agent trailer at all (pre-hook history).
                  # The hook never touches Co-authored-by lines, so a
                  # Builder trailer + legacy QA line stays "builder".
                  for line in (message or "").splitlines():
                      if line.lower().startswith("co-authored-by:") and legacy_marker.search(line):
                          role = line.split(":", 1)[1].split("<", 1)[0]
                          if legacy_role.search(role):
                              return "ta"
                  return "unknown"

              rc, rev_out = sh("git", "rev-list", f"{base}..HEAD")
              if rc != 0:
                  done("error", True, test_files, "git rev-list failed; refusing to report clean", mode)
              shas = rev_out.splitlines()
              if test_files and not shas:
                  done("error", True, test_files, "empty commit range with test files touched", mode)
              builder_shas = {}
              unknown_shas = {}
              for sha in shas:
                  # --no-renames to match the aggregate diff: a rename of
                  # a test OUT of the globs must list the deleted test
                  # path (rename detection would show only the new path
                  # and the commit would slip through as non-test).
                  rc, touched_out = sh("git", "-c", "core.quotepath=false", "show", "--pretty=format:", "--name-only", "-z", "--no-renames", sha)
                  if rc != 0:
                      done("error", True, test_files, f"git show failed on {sha[:7]}; refusing to report clean", mode)
                  touched_tests = sorted({f for f in touched_out.split("\0") if f and is_test(f)})
                  if not touched_tests:
                      continue
                  rc, msg = sh("git", "log", "-1", "--format=%B", sha)
                  if rc != 0:
                      done("error", True, test_files, f"git log failed on {sha[:7]}; refusing to report clean", mode)
                  state = classify(msg)
                  if state == "builder":
                      builder_shas[sha[:7]] = touched_tests
                  elif state == "unknown":
                      unknown_shas[sha[:7]] = touched_tests

              note_prefix = f"gate config {cfg_path} changed in this PR (judged by base policy); " if config_touched else ""
              # A known Builder hand fails however labeled: the marker
              # excuses unknown (pre-hook) provenance, never an explicit
              # Builder trailer. Consulted first so the label path (and
              # its API calls) is skipped when it cannot change the
              # verdict.
              if builder_shas:
                  detail = "; ".join(f"{s}: {', '.join(fs[:5])}" for s, fs in sorted(builder_shas.items()))
                  if mode == "enforce":
                      done("builder-touched", True, test_files, note_prefix + f"FAIL: Builder touched tests in enforce mode: {detail}", mode)
                  done("builder-touched", True, test_files, note_prefix + f"warn-only: would fail in enforce mode: {detail}", mode)
              if unknown_shas:
                  # The label is NEEDED here: prove it or fail closed.
                  # (When every commit is TA-attributed the label is not
                  # consulted at all, so a stale/self-applied label can
                  # never poison a clean PR.)
                  actor, actor_why = marker_actor()
                  if actor:
                      done("attributed", False, test_files, note_prefix + f"label `{marker}` applied by {actor} ({label_src})", mode)
                  if marker in labels:
                      done("error", True, test_files, note_prefix + f"marker label unproven ({actor_why})", mode)
                  detail = "; ".join(f"{s}: {', '.join(fs[:5])}" for s, fs in sorted(unknown_shas.items()))
                  if mode == "enforce":
                      done("builder-touched", True, test_files, note_prefix + f"FAIL: Builder touched tests in enforce mode: {detail}", mode)
                  done("builder-touched", True, test_files, note_prefix + f"warn-only: would fail in enforce mode: {detail}", mode)
              done("attributed", False, test_files, note_prefix + "all test-touching commits test-author-attributed", mode)
          except SystemExit:
              raise
          except Exception as e:
              # Last resort: never traceback out of warn mode. Mode may
              # itself be unknown here, so read it raw (default warn).
              raw_mode = os.environ.get("MODE", "warn").strip().lower()
              if raw_mode != "enforce":
                  raw_mode = "warn"
              done("error", True, set(), f"internal error: {e}", raw_mode)
          PYEOF
