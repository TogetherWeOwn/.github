# Pull-request size labels + required size gate (TogetherWeOwn standard;
# see STANDARD.md in TogetherWeOwn/.github, "Advisory PR-size labels" and
# "PR size gate").
#
# Thin caller: all logic lives once in the org `.github` repository
# (`.github/workflows/pr-size.yml`, `.github/workflows/pr-size-weekly.yml`,
# `.github/workflows/pr-size-gate.yml` and `.github/scripts/pr_size.py`) and
# runs from that repository at the pinned ref - this repo keeps no copy of
# the script. To adopt: copy this file to `.github/workflows/pr-size.yml`,
# repin all three `uses:` refs to the current TogetherWeOwn/.github `main`
# SHA, and set `exclude-extra` to this repo's generated paths.
#
# ADVISORY PART: never make `pr-size` a required check and never add it to
# a ruleset's required-workflows list. The labeller exits 0 on any API
# failure, and fork pull requests (read-only token) warn and skip.
#
# REQUIRED PART: `pr-size-gate` is the deliberate exception to that
# invariant - it FAILS pull requests too large for the automated reviewer
# and is intended as a required status check, not a required workflow.
# Merge the caller and discover its genuine PR context and GitHub Actions App.
# STOP before adding or enabling a requirement: this caller does not establish
# rule 25's meaningful default-branch result; PR observation is not a substitute.
# See STANDARD.md for the prerequisite and independent qualification hold.
# The selected c9d36db5b08703a3d7c8cd2112256f8768be44ce reusable gate header
# contains obsolete required-workflow guidance; follow the current contract.
# Qualify event refresh and enforcement before promotion; pinning the App
# does not bind a workflow or prevent another job using the same context.
# A skipped or neutral check may satisfy a requirement. Events are async:
# label/review changes do not atomically replace an earlier passing result.
# The edited event also refreshes the gate when a base change alters the
# diff; title and body edits can trigger harmless extra runs.
# The gate fails closed on measurement; within-budget forks can pass with
# best-effort comments, while over-gate forks can error. Manual dispatch is
# diagnostic only and does not refresh the required PR check.
#
# The weekly tally's schedule lives here, in the caller, because the tally
# is per-repository. It calls a SEPARATE reusable file so this job can stay
# read-only: GitHub checks a reusable workflow's nested-job permissions
# against the caller job's grant when parsing the workflow, ignoring `if:`,
# so each caller job below grants only what the file it calls requests.

name: pr-size

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number to label and evaluate now; does not refresh required checks (blank runs the weekly tally)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.event_name }}${{ github.event_name == 'workflow_dispatch' && '-dispatch' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-size:
    name: pr-size
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || inputs.pr_number != ''
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: TogetherWeOwn/.github/.github/workflows/pr-size.yml@c9d36db5b08703a3d7c8cd2112256f8768be44ce
    with:
      pr-number: ${{ inputs.pr_number || '' }}
      # This repo's generated paths, excluded on top of the script's
      # built-in lockfile/generated/fixture list. Example:
      # exclude-extra: "public/bundles/**,drizzle/meta/**"
      exclude-extra: ""

  # REQUIRED: fails pull requests too large for the automated reviewer.
  # After installing this caller, discover and qualify its actual status
  # check and expected App before requiring it (STANDARD.md).
  pr-size-gate:
    name: pr-size-gate
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || inputs.pr_number != ''
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: TogetherWeOwn/.github/.github/workflows/pr-size-gate.yml@c9d36db5b08703a3d7c8cd2112256f8768be44ce
    with:
      pr-number: ${{ inputs.pr_number || '' }}
      exclude-extra: ""

  pr-size-weekly:
    name: pr-size-weekly
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr_number == '')
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: TogetherWeOwn/.github/.github/workflows/pr-size-weekly.yml@c9d36db5b08703a3d7c8cd2112256f8768be44ce
