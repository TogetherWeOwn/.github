# Guards the test-guard-required wrapper's pinned internal reference.
# The wrapper calls the reusable by full path+ref
# (TogetherWeOwn/.github/.github/workflows/test-guard.yml@<sha>), and a
# forgotten repin means CI keeps exercising a stale gate after the
# reusable changes. This check fails when the pinned commit's copy of
# the reusable differs from the working tree's — i.e. repin the wrapper
# (to the commit carrying the reusable change) in the same PR.
# Honest-mistake tripwire only, not a boundary: it runs from the PR
# checkout, so a PR can remove it. Enforce relies on the ruleset-required
# WORKFLOW (TEST-GUARD.md step 4), never on this check. Tiny, no secrets,
# ubuntu-latest.

name: test-guard pincheck

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/test-guard.yml"
      - ".github/workflows/test-guard-required.yml"

permissions:
  contents: read

concurrency:
  group: test-guard-pincheck-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  pincheck:
    name: pincheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Wrapper pin must carry the current reusable
        run: |-
          PIN="$(grep -o 'test-guard\.yml@[0-9a-f]\{40\}' .github/workflows/test-guard-required.yml | head -1 | cut -d@ -f2)"
          if [ -z "$PIN" ]; then
            echo "::error::test-guard-pincheck: no pinned test-guard.yml@<sha> in test-guard-required.yml"
            exit 1
          fi
          if ! git diff --quiet "$PIN" HEAD -- .github/workflows/test-guard.yml; then
            echo "::error::test-guard-pincheck: wrapper pins $PIN but the reusable changed since; repin uses: to the commit carrying the reusable (see TEST-GUARD.md step 4)"
            exit 1
          fi
          echo "test-guard-pincheck: pin $PIN carries the current reusable"
