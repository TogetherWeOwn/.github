name: Bug report
description: Something is broken or behaving unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Fill out the sections below so it can be reproduced and triaged quickly.

        > **Privacy notice:** fields below accept logs or config output that may contain
        > personally identifiable information (PII) — usernames in file paths, API keys,
        > tokens, or company names. Before pasting: review for sensitive data, redact
        > usernames, paths and keys, and **never paste a live credential**. If you pasted one
        > by accident, say so in the report so it can be rotated.
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing open and closed issues and this is not a duplicate.
          required: true
        - label: I can reproduce on the latest `main`.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps a maintainer can follow.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Error messages or command output as a code block. Redact PII first; never paste tokens.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, related issues, or anything else that might help.
  - type: checkboxes
    id: pii_confirmed
    attributes:
      label: Privacy checklist
      options:
        - label: I reviewed all pasted output for PII and redacted where necessary. No live credential is included.
          required: true
